<script type="application/json" id="vdata">[{"n": "管仲", "cn": true, "t": "春秋·前645—前578", "sch": "轻重学派", "lv": "L2", "brief": "国家宏观调控、产业政策与四民分业", "y": -645, "body": "---\n姓名: 管仲\n国别: 中国\n时代: 春秋\n生卒/年代: 约前723—前645\n思想流派: 轻重学派·国家治理\n资料权威等级: 一手资料（原典传世，部分篇章存疑）\n一手资料来源: 《管子》（西汉刘向编定，托名管仲；其中《轻重》诸篇成书于战国至汉，引用时需注明篇目）\ntags: [管理思想, 中国, 古代, 轻重学派]\n---\n# 管仲\n\n> **一句话定位**：春秋首霸齐国的总设计师，国家宏观调控与产业政策的鼻祖。\n\n## 核心管理思想\n- 四民分业定居：士农工商分区居住、世代相传，专业即稳定（最早的职业分工管理）\n- 相地而衰征：按土地肥瘠分级征税（差别化的激励与资源定价）\n- 官山海：盐铁专营，国家掌握战略资源定价权\n- 轻重之术：通过粮食、货币、商品的吞吐调节物价，平抑周期（类似早期的总需求管理）\n- 仓廪实则知礼节：把物质激励置于道德教化的先决条件（比马斯洛早2600年的'先满足后教化'）\n\n## 代表著作 / 一手资料\n- 《管子》76篇：《牧民》《权修》《乘马》《轻重》甲~庚等\n\n## 与现代管理的映射\n- 盐铁专营 → 战略资源国家管控\n- 轻重之术 → 宏观调控与价格政策\n- 四民分业 → 职业分工与专业化\n\n## ⚠️ 常见误读 / 溯源提示\n- 《管子》非管仲亲著：是稷下学士依托其名逐步编成，最迟至汉代定形，研究管仲应区分'春秋史实的管仲'与'《管子》书中的思想体系'\n\n## 关联\n- [[流派-中国轻重学派]]\n- [[流派-中国商家]]\n- [[桑弘羊]]\n- [[司马迁]]\n\n---\n📚 溯源：《管子》（西汉刘向编定，托名管仲；其中《轻重》诸篇成书于战国至汉，引用时需注明篇目） ｜ 权威等级：一手资料（原典传世，部分篇章存疑）\n"}, {"n": "老子", "cn": true, "t": "春秋·前6世纪", "sch": "道家", "lv": "L1", "brief": "无为而治：自组织管理的源头", "y": -6, "body": "---\n姓名: 老子\n国别: 中国\n时代: 春秋\n生卒/年代: 约前571—前471\n思想流派: 道家·无为而治\n资料权威等级: 一手资料（原典传世，郭店楚简、马王堆帛书多版本互证）\n一手资料来源: 《老子》（《道德经》）：王弼通行本；郭店楚简本（前300年左右，最接近祖本）；马王堆帛书本\ntags: [管理思想, 中国, 古代, 道家]\n---\n# 老子\n\n> **一句话定位**：以'无为'为核心的自组织管理哲学，现代'授权、赋能、去中心化'的东方源头。\n\n## 核心管理思想\n- 无为而治：管理者不妄为，让系统依规律自运行——减少干预即降低管理成本\n- 治大国若烹小鲜：频繁翻动（政策多变）会把事情搅碎——政策连续性原则\n- 柔弱胜刚强：柔性、渐进的管理优于刚性强控\n- 知人者智，自知者明：领导者自我认知优先于识人之智\n- 为学日益，为道日损：组织要持续做减法，聚焦本质\n\n## 代表著作 / 一手资料\n- 《道德经》81章（通行本）；郭店楚简《老子》甲乙丙三组；马王堆帛书甲乙本\n\n## 与现代管理的映射\n- 无为 → 授权赋能、去中心化组织\n- 烹小鲜 → 政策稳定性\n- 自组织 → 霍顿式平台型组织的东方先声\n\n## ⚠️ 常见误读 / 溯源提示\n- '无为'≠不作为：是'不妄为'（不逆规律而动）。市面鸡汤把它稀释成'躺平哲学'，背离原典'无为而无不为'的治理效能导向\n\n## 关联\n- [[流派-中国道家]]\n- [[庄子]]\n\n---\n📚 溯源：《老子》（《道德经》）：王弼通行本；郭店楚简本（前300年左右，最接近祖本）；马王堆帛书本 ｜ 权威等级：一手资料（原典传世，郭店楚简、马王堆帛书多版本互证）\n"}, {"n": "孔子", "cn": true, "t": "春秋·前551—前479", "sch": "儒家", "lv": "L1", "brief": "德治+礼制：伦理化的组织秩序", "y": -551, "body": "---\n姓名: 孔子\n国别: 中国\n时代: 春秋\n生卒/年代: 前551—前479\n思想流派: 儒家·伦理治理\n资料权威等级: 一手资料（语录体原典，编定于战国）\n一手资料来源: 《论语》（孔子弟子及再传弟子编纂）；《礼记》部分篇章\ntags: [管理思想, 中国, 古代, 儒家]\n---\n# 孔子\n\n> **一句话定位**：以'仁—礼'结构把道德规范制度化，奠定东亚组织伦理两千年。\n\n## 核心管理思想\n- 为政以德：管理者以身作则是最高效的控制方式（其身正，不令而行）\n- 正名：组织中的名分、职责、汇报关系必须先理清（名不正则言不顺）\n- 礼：把等级秩序仪式化、制度化，降低协作成本\n- 举直错诸枉：选人用人是治理的第一杠杆\n- 和而不同：团队协作的价值底色——目标一致但允许表达差异\n\n## 代表著作 / 一手资料\n- 《论语》20篇（《学而》《为政》《八佾》等）\n\n## 与现代管理的映射\n- 德治 → 价值观领导与文化管理\n- 正名 → 组织设计与职责说明书\n- 举直 → 用人所长、干部选拔\n\n## ⚠️ 常见误读 / 溯源提示\n- '以德治国'被简化成道德说教：孔子同时强调'礼'的制度设计（礼=制度化的行为规范），德是内核、礼是外壳，二者不可偏废\n\n## 关联\n- [[流派-中国儒家]]\n- [[孟子]]\n- [[荀子]]\n- [[曾仕强]]\n\n---\n📚 溯源：《论语》（孔子弟子及再传弟子编纂）；《礼记》部分篇章 ｜ 权威等级：一手资料（语录体原典，编定于战国）\n"}, {"n": "孙武（孙子）", "cn": true, "t": "春秋·前6—5世纪", "sch": "兵家", "lv": "L1", "brief": "五事七计：系统竞争分析框架", "y": -6, "body": "---\n姓名: 孙武（孙子）\n国别: 中国\n时代: 春秋\n生卒/年代: 约前545—前470\n思想流派: 兵家·战略管理\n资料权威等级: 一手资料（原典传世，1972年银雀山汉墓竹简与传世本互证）\n一手资料来源: 《孙子兵法》十三篇（银雀山汉墓出土竹简为最早实物本，证实十三篇结构在先秦已定型）\ntags: [管理思想, 中国, 古代, 兵家]\n---\n# 孙武（孙子）\n\n> **一句话定位**：系统战略管理思想的源头，'竞争分析'框架的原型。\n\n## 核心管理思想\n- 五事七计：道、天、地、将、法——战略制定前要系统评估的五类要素（含领导力与组织制度）\n- 知彼知己，百战不殆：信息对称是决策前提（竞争情报思想源头）\n- 上兵伐谋：最优竞争是避免正面消耗，用谋略改变竞争结构\n- 势与节：造势（组织势能）与择机（节奏控制）——战略执行的两翼\n- 因势利导、因变制胜：战略必须随环境调整（比权变理论早2400年）\n- 赏罚孰明：激励机制影响战斗力（'令之以文，齐之以武'＝恩威并施）\n\n## 代表著作 / 一手资料\n- 《孙子兵法》：《计》《作战》《谋攻》《形》《势》《虚实》《军争》《九变》《行军》《地形》《九地》《火攻》《用间》十三篇\n\n## 与现代管理的映射\n- 五事七计 → PEST+SWOT 的原始形态\n- 用间 → 竞争情报系统\n- 伐谋伐交 → 战略联盟与竞合\n- 势 → 组织能力构建\n\n## ⚠️ 常见误读 / 溯源提示\n- 原典语境是战争与政治，'商战套用'多为后世演绎（以日本稻田朋之等明治汉学家为桥），移植时需重新定义'伐''军'的边界，不可机械套用\n\n## 关联\n- [[流派-中国兵家]]\n- [[理论-波特五力模型]]\n- [[理论-SWOT分析]]\n- [[孙膑]]\n\n---\n📚 溯源：《孙子兵法》十三篇（银雀山汉墓出土竹简为最早实物本，证实十三篇结构在先秦已定型） ｜ 权威等级：一手资料（原典传世，1972年银雀山汉墓竹简与传世本互证）\n"}, {"n": "范蠡", "cn": true, "t": "春秋末·前5世纪", "sch": "商家", "lv": "L2", "brief": "逆周期布局与现金流纪律", "y": -5, "body": "---\n姓名: 范蠡\n国别: 中国\n时代: 春秋末\n生卒/年代: 前536—前448\n思想流派: 商家·治生之学\n资料权威等级: 一手资料（原典散佚，主要依《史记》等史传）\n一手资料来源: 《史记·货殖列传》《史记·越王勾践世家》；托名著作《陶朱公商训》系明清商人伪托，非一手\ntags: [管理思想, 中国, 古代, 商家]\n---\n# 范蠡\n\n> **一句话定位**：从政（灭吴兴越）到经商（三聚三散其财）双巅峰，'治生之学'的人格化象征。\n\n## 核心管理思想\n- 计然之策：'旱则资舟，水则资车'——逆向布局、逆周期投资（最早的库存与时机管理）\n- 贵出如粪土，贱取如珠玉：价格纪律，克服追涨杀跌的人性弱点\n- 务完物，无息币：保证商品质量、加速资金周转（现金流思想）\n- 与时逐而不责于人：跟周期博弈，不把失败归咎于他人\n\n## 代表著作 / 一手资料\n- 《史记·货殖列传》所记计然之术、范蠡言行（一手史传）；《陶朱公生意经》为伪托，只可作民俗资料\n\n## 与现代管理的映射\n- 逆周期投资 → 反周期库存与财务策略\n- 无息币 → 营运资本管理与周转率\n- 贵出贱取 → 交易纪律与行为金融\n\n## ⚠️ 常见误读 / 溯源提示\n- 市面流传的《陶朱公商训十二条》'十二条'成文极晚（不早于明清商书），引用范蠡观点应回到《史记》原文\n\n## 关联\n- [[流派-中国商家]]\n- [[司马迁]]\n- [[白圭]]\n\n---\n📚 溯源：《史记·货殖列传》《史记·越王勾践世家》；托名著作《陶朱公商训》系明清商人伪托，非一手 ｜ 权威等级：一手资料（原典散佚，主要依《史记》等史传）\n"}, {"n": "李悝", "cn": true, "t": "战国·约前479—前396", "sch": "法家先驱", "lv": "L3", "brief": "平籴法与尽地力：最早的KPI农业政策", "y": -479, "body": "---\n姓名: 李悝\n国别: 中国\n时代: 战国\n生卒/年代: 前455—前395\n思想流派: 法家先驱·变法改革\n资料权威等级: 一手资料（原典已佚，赖《汉书·食货志》等转引）\n一手资料来源: 《汉书·食货志》引《李悝法经》与'尽地力之教'；《法经》六篇原书已佚\ntags: [管理思想, 中国, 古代, 法家]\n---\n# 李悝\n\n> **一句话定位**：战国变法第一人，魏国霸业的制度总设计师。\n\n## 核心管理思想\n- 尽地力之教：提高单位土地产出的激励与考核制度（最早的KPI导向农业政策）\n- 平籴法：丰年收购、荒年平价抛售的国家储备调节（前馈控制的古代样本）\n- 食有劳而禄有功：废除世卿世禄，按功劳分配爵禄（绩效考核驱动的组织变革）\n- 著《法经》六篇：把组织规则成文化、法典化\n\n## 代表著作 / 一手资料\n- 《法经》（已佚，框架赖《晋书·刑法志》《唐律疏议》引述保存）\n\n## 与现代管理的映射\n- 平籴法 → 战略储备与应急物资管理\n- 禄有功 → 绩效薪酬制度\n- 《法经》 → 制度化管理与合规体系\n\n## ⚠️ 常见误读 / 溯源提示\n- 原典全佚，今人引用《李悝法经》内容必须注明转引文献层级，不可当成李悝原文直接征引\n\n## 关联\n- [[流派-中国法家]]\n- [[商鞅]]\n- [[吴起]]\n\n---\n📚 溯源：《汉书·食货志》引《李悝法经》与'尽地力之教'；《法经》六篇原书已佚 ｜ 权威等级：一手资料（原典已佚，赖《汉书·食货志》等转引）\n"}, {"n": "墨子", "cn": true, "t": "战国·约前468—前376", "sch": "墨家", "lv": "L1", "brief": "尚贤尚同与巨子纪律组织", "y": -468, "body": "---\n姓名: 墨子\n国别: 中国\n时代: 战国\n生卒/年代: 约前476—前390\n思想流派: 墨家·组织纪律与执行力\n资料权威等级: 一手资料（原典传世，《墨子》部分篇章存疑）\n一手资料来源: 《墨子》53篇：《尚贤》《尚同》《兼爱》《非攻》《节用》；《墨经》为后期墨家（墨者集团）所作\ntags: [管理思想, 中国, 古代, 墨家]\n---\n# 墨子\n\n> **一句话定位**：中国历史上第一个准军事化纪律组织'巨子'制度的缔造者。\n\n## 核心管理思想\n- 尚贤：打破血缘，'官无常贵而民无终贱'，唯能是举——最早的选贤任能平等主义\n- 尚同：组织目标层层对齐到'天志'，思想与行动高度统一（目标一致性的极致）\n- 兼爱：组织内部的互惠伦理，消除本位主义\n- 巨子制度：墨家首领（巨子）有绝对权威、成员'以巨子为圣人'——自愿服从的纪律型组织\n- 三表法：立论须有本之者（历史经验）、原之者（群众见闻）、用之者（实践效果）——经验验证的决策标准\n\n## 代表著作 / 一手资料\n- 《墨子》：《尚贤》《尚同》《兼爱》《非攻》《节用》《墨经》等\n\n## 与现代管理的映射\n- 尚贤 → 能力本位的人力资源\n- 尚同 → 愿景对齐与OKR的思想远源\n- 三表法 → 数据驱动决策的雏形\n\n## ⚠️ 常见误读 / 溯源提示\n- 墨家在汉代后中绝近两千年，今人对'巨子制度'的了解依赖《吕氏春秋》等二手记述，直接材料有限，引用需注明转引\n\n## 关联\n- [[流派-中国墨家]]\n- [[孔子]]\n- [[韩非子]]\n\n---\n📚 溯源：《墨子》53篇：《尚贤》《尚同》《兼爱》《非攻》《节用》；《墨经》为后期墨家（墨者集团）所作 ｜ 权威等级：一手资料（原典传世，《墨子》部分篇章存疑）\n"}, {"n": "吴起", "cn": true, "t": "战国·前440—前381", "sch": "兵家兼法家变法", "lv": "L1", "brief": "吴起变法：在楚国以制度与编户齐民重构国家组织能力", "y": -440, "body": "---\ntags: [存目]\n---\n# 吴起\n\n战国兵家与改革家：与士卒同甘苦的'视卒如婴儿'是最早的关怀式领导实践。见 [[孙武（孙子）]] [[流派-中国兵家]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "商鞅", "cn": true, "t": "战国·前390—前338", "sch": "法家", "lv": "L1", "brief": "徙木立信：制度变革的信任工程", "y": -390, "body": "---\n姓名: 商鞅\n国别: 中国\n时代: 战国\n生卒/年代: 约前390—前338\n思想流派: 法家·制度变革\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《商君书》（战国法家著作汇编，大部分为商鞅及其后学所作）\ntags: [管理思想, 中国, 古代, 法家]\n---\n# 商鞅\n\n> **一句话定位**：把组织当作可重构系统，用制度设计而非道德说教改造国家。\n\n## 核心管理思想\n- 壹赏壹刑壹教：激励、惩罚、教育三者口径统一，指向同一个组织目标\n- 军功爵制：以可量化战功决定社会等级流动（目标—考核—晋升闭环的极端样本）\n- 什伍连坐：以互相监督降低管理成本（信息监控思想，现代慎用）\n- 燔诗书而明法令：用制度文本取代口口相传的习俗（组织知识显性化）\n- 徙木立信：变革前的'承诺可信度'建设——新制度必须配信任工程\n\n## 代表著作 / 一手资料\n- 《商君书》26篇（《更法》《垦令》《赏刑》《画策》等）\n\n## 与现代管理的映射\n- 军功爵制 → OKR/战功考核的古代极端版\n- 徙木立信 → 变革管理中的信任建立\n- 壹赏壹刑 → 激励一致性原则\n\n## ⚠️ 常见误读 / 溯源提示\n- '商鞅变法'常被只讲'严刑峻法'：其本质是目标一致的组织系统再造（农战立国），刑罚只是子系统\n\n## 关联\n- [[流派-中国法家]]\n- [[李悝]]\n- [[韩非子]]\n\n---\n📚 溯源：《商君书》（战国法家著作汇编，大部分为商鞅及其后学所作） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "孟子", "cn": true, "t": "战国·前372—前289", "sch": "儒家", "lv": "L1", "brief": "民本与义利之辨：组织正当性的伦理基础", "y": -372, "body": "---\ntags: [存目]\n---\n# 孟子\n\n儒家亚圣：民贵君轻、仁政。与孔子并称，是儒家治理思想从'君子之德'走向'王道制度'的桥梁。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "庄子", "cn": true, "t": "战国·前369—前286", "sch": "道家", "lv": "L1", "brief": "庖丁解牛与\"无用之用\"：能力—环境匹配的古典表达", "y": -369, "body": "---\ntags: [存目]\n---\n# 庄子\n\n道家：'无为'的哲学化展开——'上必无为而用天下，下必有为而为天下用'，主从分工的思想雏形。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "孙膑", "cn": true, "t": "战国·约前380—前316", "sch": "兵家", "lv": "L1", "brief": "减灶诱敌与攻其所必救：成本—收益式的竞争决策", "y": -380, "body": "---\ntags: [存目]\n---\n# 孙膑\n\n孙武后裔，《孙膑兵法》1972年银雀山汉墓与《孙子兵法》同墓出土，互证孙氏兵法传统。见 [[孙武（孙子）]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "荀子", "cn": true, "t": "战国末·前313—前238", "sch": "儒家", "lv": "L1", "brief": "性恶论→制度激励设计的第一性原理", "y": -313, "body": "---\n姓名: 荀子\n国别: 中国\n时代: 战国末\n生卒/年代: 约前313—前238\n思想流派: 儒家·制度与性恶论\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《荀子》32篇（大部分为荀子亲著）\ntags: [管理思想, 中国, 古代, 儒家]\n---\n# 荀子\n\n> **一句话定位**：把儒家伦理接上法家制度的桥：'化性起伪'的人性改造论是组织激励设计的基石。\n\n## 核心管理思想\n- 性恶论：人天生趋利避害，善行靠后天制度与教化塑造——制度设计的第一性原理\n- 化性起伪：用礼义法度（伪=人为）改造天性，即组织用制度重塑人\n- 明分使群：人之所以能协作成群，靠'分'（分工与名分）——分工理论的中国源头\n- 隆礼重法：礼（软约束）+法（硬约束）并用，开儒法合流先声\n- 君子生非异也，善假于物也：善用工具与系统（外脑、外骨骼）放大个人效能\n\n## 代表著作 / 一手资料\n- 《荀子》：《劝学》《性恶》《王制》《富国》《天论》等\n\n## 与现代管理的映射\n- 性恶/化性起伪 → X理论与制度激励设计\n- 明分使群 → 分工与组织设计\n- 善假于物 → 杠杆与工具思维\n\n## ⚠️ 常见误读 / 溯源提示\n- '性恶'常被误读为对人性悲观：实则是制度主义的出发点——正因为不完美，才需要设计好的制度与教化系统\n\n## 关联\n- [[流派-中国儒家]]\n- [[孔子]]\n- [[韩非子]]\n- [[麦格雷戈]]\n\n---\n📚 溯源：《荀子》32篇（大部分为荀子亲著） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "韩非子", "cn": true, "t": "战国末·前280—前233", "sch": "法家", "lv": "L1", "brief": "循名责实：最早的岗位责任制", "y": -280, "body": "---\n姓名: 韩非子\n国别: 中国\n时代: 战国末\n生卒/年代: 约前280—前233\n思想流派: 法家·集权理论集大成\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《韩非子》55篇（绝大部分为韩非亲著，《初见秦》一篇真伪有争议）\ntags: [管理思想, 中国, 古代, 法家]\n---\n# 韩非子\n\n> **一句话定位**：法、术、势三位一体的权力操作系统设计者，'制度化管理'最彻底的古典表述。\n\n## 核心管理思想\n- 法不阿贵：制度面前人人平等——组织规则的可预期性来自对特权的禁止\n- 因任而授官，循名而责实：按岗位授权、按名分考核实绩（中国最早的职位说明书思想）\n- 术者，因任而授官：领导者的驭人之术（信息不对称下的监督）\n- 势：职位权威本身是一种资源，应与个人魅力区分\n- 世异则事异：制度要随环境迭代（变革管理的古典版本）\n\n## 代表著作 / 一手资料\n- 《韩非子》：《二柄》《定法》《难势》《五蠹》《显学》等\n\n## 与现代管理的映射\n- 法不阿贵 → 制度公平与组织正义\n- 循名责实 → 岗位责任制与述职考核\n- 因任授官 → 人岗匹配\n\n## ⚠️ 常见误读 / 溯源提示\n- 常被与'权谋厚黑'划等号：韩非子讲的是公开的制度（法）与职位权威（势），'术'也要求制度化而非私相授受，与阴谋论有本质区别\n\n## 关联\n- [[流派-中国法家]]\n- [[商鞅]]\n- [[马克斯·韦伯]]\n\n---\n📚 溯源：《韩非子》55篇（绝大部分为韩非亲著，《初见秦》一篇真伪有争议） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "白圭", "cn": true, "t": "战国·前5世纪", "sch": "商家", "lv": "L1", "brief": "人弃我取：逆向投资宗师", "y": -5, "body": "---\n姓名: 白圭\n国别: 中国\n时代: 战国\n生卒/年代: 前370—前300\n思想流派: 商家·治生之学\n资料权威等级: 一手资料（原典已佚，依《史记·货殖列传》）\n一手资料来源: 《史记·货殖列传》：'白圭，周人也……乐观时变'\ntags: [管理思想, 中国, 古代, 商家]\n---\n# 白圭\n\n> **一句话定位**：明确提出'治生之学'学科自觉，'人弃我取，人取我与'的逆向投资宗师。\n\n## 核心管理思想\n- 人弃我取，人取我与：逆向操作的库存与买卖纪律\n- 乐观时变：对周期信号（岁星纪年下的农业周期）保持敏感\n- 吾治生产，犹伊尹、吕尚之谋，孙吴用兵：经商要用战略家与军事家的方法\n- 智、勇、仁、强四德为商之素质模型：'其智不足与权变，勇不足以决断……'\n\n## 代表著作 / 一手资料\n- 《史记·货殖列传》所载言行（原典《白圭书》已佚）\n\n## 与现代管理的映射\n- 人弃我取 → 逆向投资与反共识决策\n- 四德 → 创业者素质模型\n- 时变 → 周期分析\n\n## ⚠️ 常见误读 / 溯源提示\n- 无本人著作传世，所有'白圭语录'均经《史记》一层转述，属一手史传而非本人文本\n\n## 关联\n- [[流派-中国商家]]\n- [[范蠡]]\n- [[司马迁]]\n\n---\n📚 溯源：《史记·货殖列传》：'白圭，周人也……乐观时变' ｜ 权威等级：一手资料（原典已佚，依《史记·货殖列传》）\n"}, {"n": "桑弘羊", "cn": true, "t": "西汉·前2—1世纪", "sch": "轻重学派", "lv": "L2", "brief": "均输平准：国家平准基金", "y": -2, "body": "---\n姓名: 桑弘羊\n国别: 中国\n时代: 西汉\n生卒/年代: 前152—前80\n思想流派: 轻重学派·国家专营\n资料权威等级: 一手资料（会议纪要传世，《盐铁论》为对话实录体）\n一手资料来源: 《盐铁论》60篇（汉桓宽据昭帝盐铁会议记录整理，'推衍盐铁之议，增广条目'——整理者加工痕迹需知）\ntags: [管理思想, 中国, 古代, 轻重学派]\n---\n# 桑弘羊\n\n> **一句话定位**：汉武帝的财政总长，国家垄断经营与宏观调控的古典高峰。\n\n## 核心管理思想\n- 盐铁专营、均输平准：国家直接进入流通环节，平抑物价并充实财政\n- 平准法：在长安设平准官，贱买贵卖稳定物价——最早的'平准基金'思想\n- 假民公田、移民实边：以财政手段配合人口与边疆政策（资源的空间配置）\n- 在盐铁会议上与贤良文学辩论：'富在术数，不在劳身；利在势居，不在力耕'——重视资源配置而非苦干\n\n## 代表著作 / 一手资料\n- 《盐铁论》（桓宽整理）：《本议》《力耕》《轻重》等60篇\n\n## 与现代管理的映射\n- 均输平准 → 储备调节与价格干预\n- 盐铁专营 → 战略行业国资控股的古代样本\n- 富在术数 → 资源配置效率优先\n\n## ⚠️ 常见误读 / 溯源提示\n- 《盐铁论》是桓宽'推衍增广'的文学性整理，对话未必字字实录，但双方立场框架大体可信，引用宜标篇名\n\n## 关联\n- [[流派-中国轻重学派]]\n- [[管仲]]\n- [[刘晏]]\n\n---\n📚 溯源：《盐铁论》60篇（汉桓宽据昭帝盐铁会议记录整理，'推衍盐铁之议，增广条目'——整理者加工痕迹需知） ｜ 权威等级：一手资料（会议纪要传世，《盐铁论》为对话实录体）\n"}, {"n": "司马迁", "cn": true, "t": "西汉·约前145/135—前86", "sch": "史家·货殖", "lv": "L1", "brief": "善者因之：政策工具五层级", "y": -145, "body": "---\n姓名: 司马迁\n国别: 中国\n时代: 西汉\n生卒/年代: 前145—约前86\n思想流派: 史家·货殖思想\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《史记》特别是《货殖列传》《平准书》——中国最早的经济史与管理思想史文献\ntags: [管理思想, 中国, 古代, 商家]\n---\n# 司马迁\n\n> **一句话定位**：为商人立传、为'利'正名的史家，《货殖列传》是东方最早的商业管理思想史。\n\n## 核心管理思想\n- 天下熙熙，皆为利来：承认利益驱动是人的基本动力（对经济人的早期洞见）\n- 善者因之，其次利道之，其次教诲之，其次整齐之，最下者与之争：政策工具五层级——最好的管理是顺应自发秩序\n- 素封：无官爵而富比封君者——市场地位可以替代政治地位\n- 富无经业，则货无常主：财富不固定于行业与主人，能者辐凑（要素流动的动态观）\n- 刺绣文不如倚市门：机会成本与比较优势的朴素表述\n\n## 代表著作 / 一手资料\n- 《史记·货殖列传》《史记·平准书》《史记·平准书》\n\n## 与现代管理的映射\n- 因之政策 → 自由市场与无为监管的谱系\n- 利道 → 激励相容机制设计\n\n## ⚠️ 常见误读 / 溯源提示\n- 《货殖列传》为'序传'性质的总论，其中所记范蠡、白圭等人事迹带有史家的理想化重构，宜作'思想材料'而非'史实细节'使用\n\n## 关联\n- [[流派-中国商家]]\n- [[范蠡]]\n- [[白圭]]\n- [[管仲]]\n\n---\n📚 溯源：《史记》特别是《货殖列传》《平准书》——中国最早的经济史与管理思想史文献 ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "刘晏", "cn": true, "t": "唐·8世纪", "sch": "轻重学派", "lv": "L2", "brief": "巡院系统：最早的管理信息系统", "y": 0, "body": "---\n姓名: 刘晏\n国别: 中国\n时代: 唐\n生卒/年代: 716—780\n思想流派: 轻重学派·财政改革\n资料权威等级: 一手资料（赖《旧唐书》《新唐书》本传及《册府元龟》）\n一手资料来源: 《新唐书·刘晏传》（欧阳修撰）；《旧唐书·食货志》；本人著作已佚\ntags: [管理思想, 中国, 古代, 轻重学派]\n---\n# 刘晏\n\n> **一句话定位**：唐代'计相'，把国家财政从'盘剥'改造为'信息流+物流'的专业化运营。\n\n## 核心管理思想\n- 理财以养民为先：财政收入的增长必须建立在经济活动繁荣之上（做大蛋糕论）\n- 广置巡院、精选人才：全国设情报网络（知院官）提前掌握粮价、灾情信息——最早的管理信息系统\n- 以重价募善走者，置递相望：用市场化高薪激励建立快速信息通道\n- 常平法改良：'丰则贵取，饥则贱与'，但不用暴力征购，靠信息与物流赚钱\n- 食盐专卖改民制官收商销：引入民营企业进入国家专营链条（BOT式的制度创新）\n\n## 代表著作 / 一手资料\n- 《新唐书·刘晏传》《旧唐书·食货志》所载政策（本人奏议多佚）\n\n## 与现代管理的映射\n- 巡院系统 → MIS与商业智能的古代原型\n- 养民为先 → 以用户/商户繁荣为收入前提的平台逻辑\n\n## ⚠️ 常见误读 / 溯源提示\n- 事迹主要依赖两唐书传记（史家二手整理），其'信息理财'细节如'知院官'多出自刘晏本传，引用应注明出自正史而非刘晏亲著\n\n## 关联\n- [[流派-中国轻重学派]]\n- [[管仲]]\n- [[桑弘羊]]\n\n---\n📚 溯源：《新唐书·刘晏传》（欧阳修撰）；《旧唐书·食货志》；本人著作已佚 ｜ 权威等级：一手资料（赖《旧唐书》《新唐书》本传及《册府元龟》）\n"}, {"n": "王安石", "cn": true, "t": "北宋·1021—1086", "sch": "变法改革", "lv": "L2", "brief": "青苗法：政策性金融的国家版本", "y": 1021, "body": "---\n姓名: 王安石\n国别: 中国\n时代: 北宋\n生卒/年代: 1021—1086\n思想流派: 变法改革·国家金融\n资料权威等级: 一手资料（文集传世，奏议为本人手笔）\n一手资料来源: 《临川先生文集》（奏议、书信）；青苗、募役等法条文载于《宋史·食货志》\ntags: [管理思想, 中国, 古代, 法家]\n---\n# 王安石\n\n> **一句话定位**：用国家金融与组织改革解决财政积弊，'因天下之力以生天下之财'的顶层设计者。\n\n## 核心管理思想\n- 因天下之力，生天下之财：财富是创造出来的，政府应发展生产而非仅节流\n- 青苗法：政府在农闲低息贷款、收获收回——用信贷平滑农业周期（农村金融的国家版本）\n- 募役法：以钱代役，把徭役货币化，解放劳动力并统一国家用工市场\n- 考课法：对地方官设明确考核指标（按政绩升降），宋代最早的干部考核改革\n- 三不足精神：天变不足畏、祖宗不足法、人言不足恤——变革者的认知框架\n\n## 代表著作 / 一手资料\n- 《临川先生文集》；《宋史·食货志》所载新法条文\n\n## 与现代管理的映射\n- 青苗法 → 政策性金融与普惠金融\n- 考课法 → 干部绩效考核\n- 三不足 → 变革领导力的信念系统\n\n## ⚠️ 常见误读 / 溯源提示\n- 《宋史》成书于元末，对王安石多有贬抑（'聚敛'之评受党争影响），现代研究应参考邓广铭等宋史专门研究校正正史偏见\n\n## 关联\n- [[李悝]]\n- [[商鞅]]\n- [[桑弘羊]]\n\n---\n📚 溯源：《临川先生文集》（奏议、书信）；青苗、募役等法条文载于《宋史·食货志》 ｜ 权威等级：一手资料（文集传世，奏议为本人手笔）\n"}, {"n": "张謇", "cn": true, "t": "近代·1853—1926", "sch": "实业救国", "lv": "L2", "brief": "实业—教育—慈善区域开发模式", "y": 1853, "body": "---\n姓名: 张謇\n国别: 中国\n时代: 近代\n生卒/年代: 1853—1926\n思想流派: 实业救国·儒家商人\n资料权威等级: 一手资料（文集、日记传世）\n一手资料来源: 《张謇全集》（日记、函电、奏议）；大生纱厂档案（南通博物苑藏）\ntags: [管理思想, 中国, 近代, 儒家]\n---\n# 张謇\n\n> **一句话定位**：状元下海，'实业—教育—慈善'三位一体的近代区域开发模式开创者。\n\n## 核心管理思想\n- 实业救国：以棉纺为龙头带动区域产业链（通海垦牧、大生系统）\n- 父教育而母实业：企业办教育（南通师范、纺织专门学校）——组织能力建设的外溢\n- 村落主义：以南通为样本的整体区域经营（城镇规划、水利、慈善一体）\n- 以众人之力，成众人之事：股份制吸纳社会资本的组织形式\n\n## 代表著作 / 一手资料\n- 《张謇全集》；大生企业档案；《啬翁自订年谱》\n\n## 与现代管理的映射\n- 产业龙头带动 → 产业集群理论的先声','企业办教育 → 企业大学与人才自培\n\n## ⚠️ 常见误读 / 溯源提示\n- 其'实业救国'常被浪漫化；大生系统1920年代后严重负债，说明其模式的财务边界，研究应结合企业史（如《大生纺织公司年鉴》）而非只看本人文集\n\n## 关联\n- [[卢作孚]]\n- [[范旭东]]\n- [[流派-中国儒家]]\n\n---\n📚 溯源：《张謇全集》（日记、函电、奏议）；大生纱厂档案（南通博物苑藏） ｜ 权威等级：一手资料（文集、日记传世）\n"}, {"n": "穆藕初", "cn": true, "t": "近代·1876—1943", "sch": "科学管理", "lv": "L1", "brief": "泰勒制全译第一人（1916）", "y": 1876, "body": "---\n姓名: 穆藕初\n国别: 中国\n时代: 近代\n生卒/年代: 1876—1943\n思想流派: 科学管理·中国引进第一人\n资料权威等级: 一手资料（译著、文集传世）\n一手资料来源: 穆藕初译《科学管理原理》（泰勒原著，1916年中华书局版，中国第一个泰勒全译本）；《藕初五十自述》\ntags: [管理思想, 中国, 近代, 科学管理]\n---\n# 穆藕初\n\n> **一句话定位**：把泰勒制系统引入中国并本土化的第一人，'五十自述'自述其德大纱厂实践。\n\n## 核心管理思想\n- 1916年全译泰勒《科学管理原理》：比日本系统译介更早，并撰写序言推广\n- 德大纱厂实践：推行标准工作法、检纱记分、人员考绩卡片——泰勒制的中国试验田\n- 锭子射手（换锭工）操作动作研究：亲自做时间与动作研究，把换锭时间从数分钟压到几十秒\n- 科学管理与传统文化调和：主张'以科学方法补旧道德之不足'\n\n## 代表著作 / 一手资料\n- 《科学管理原理》中译本（1916）；《藕初五十自述》；《工厂适用学理的管理法》\n\n## 与现代管理的映射\n- 中国版泰勒制落地 → 管理思想本土化的第一案例\n- 考绩卡片 → 现代绩效管理的雏形\n\n## ⚠️ 常见误读 / 溯源提示\n- 其译介与实践长期被'买办'叙事遮蔽，实际上他是把科学管理与儒家伦理结合的第一人，研究其价值应回到《藕初五十自述》原文\n\n## 关联\n- [[弗雷德里克·泰勒]]\n- [[张謇]]\n- [[卢作孚]]\n\n---\n📚 溯源：穆藕初译《科学管理原理》（泰勒原著，1916年中华书局版，中国第一个泰勒全译本）；《藕初五十自述》 ｜ 权威等级：一手资料（译著、文集传世）\n"}, {"n": "范旭东", "cn": true, "t": "近代·1883—1945", "sch": "技术立国", "lv": "L2", "brief": "永利碱厂：技术自主与四大信条", "y": 1883, "body": "---\n姓名: 范旭东\n国别: 中国\n时代: 近代\n生卒/年代: 1883—1945\n思想流派: 永利碱厂·技术立国\n资料权威等级: 一手资料（文集、企业档案）\n一手资料来源: 《范旭东遗著汇存》；永利化学工业公司档案；侯德榜《制碱》\ntags: [管理思想, 中国, 近代, 儒家]\n---\n# 范旭东\n\n> **一句话定位**：'中国民族化学工业之父'，永利制碱打破卜内门垄断，侯氏制碱法的幕后组织者。\n\n## 核心管理思想\n- 以技术自立打破外资垄断：散尽家财研制纯碱，十年攻坚（技术战略优先）\n- 侯氏制碱法：组织科学家侯德榜攻关，成果公开共享——开放式创新的先声\n- 永久黄'四大信条'（永久团体信条）：我们在原则上绝对的相信科学；在事业上积极的发展实业；在行动上宁愿牺牲个人顾全团体；在精神上以能服务社会为最大光荣\n- 企业即事业共同体：科学家、工程师与工人同甘共苦的'永久'文化\n\n## 代表著作 / 一手资料\n- 《范旭东遗著汇存》；永利公司档案；侯德榜《制碱》（英文版1948）\n\n## 与现代管理的映射\n- 技术攻坚十年 → 长期主义研发战略\n- 四大信条 → 企业价值观宪章\n- 成果共享 → 开放创新\n\n## ⚠️ 常见误读 / 溯源提示\n- '侯氏制碱法'属于侯德榜的发明，范旭东的贡献是组织与投入，引用时二者应分清，不可把技术成果归于管理者个人\n\n## 关联\n- [[张謇]]\n- [[卢作孚]]\n- [[德鲁克]]\n\n---\n📚 溯源：《范旭东遗著汇存》；永利化学工业公司档案；侯德榜《制碱》 ｜ 权威等级：一手资料（文集、企业档案）\n"}, {"n": "卢作孚", "cn": true, "t": "近代·1893—1952", "sch": "社会企业", "lv": "L2", "brief": "民生公司并购整合+宜昌大撤退调度", "y": 1893, "body": "---\n姓名: 卢作孚\n国别: 中国\n时代: 近代\n生卒/年代: 1893—1952\n思想流派: 民生公司·社会企业\n资料权威等级: 一手资料（文集、公司档案）\n一手资料来源: 《卢作孚文集》；民生公司档案；晏阳初、梁漱溟等同时代记述\ntags: [管理思想, 中国, 近代, 儒家]\n---\n# 卢作孚\n\n> **一句话定位**：'中国船王'，用'统一川江航运'整合战前航运业，宜昌大撤退的民族功臣。\n\n## 核心管理思想\n- 化零为整：以民生公司统一川江几十家小轮船公司——并购整合的古典样本\n- 服务社会，便利人群，开发产业，富强国家：企业宗旨高于利润\n- 群策群力与'民生精神'：公司刊物、员工学校、宿舍家庭化——文化管理与人本管理实践\n- 三段航行法（宜昌大撤退）：以调度与时刻表设计完成40天抢运10万吨物资的'中国敦刻尔克'——流程优化救亡\n- 以事业为家：员工低薪高认同，用意义感替代物质激励\n\n## 代表著作 / 一手资料\n- 《卢作孚文集》；民生公司史资料（《民生公司》档案汇编）\n\n## 与现代管理的映射\n- 化零为整 → 行业整合与并购\n- 三段航行法 → 瓶颈调度与运营优化\n- 企业精神 → 组织文化与雇主品牌\n\n## ⚠️ 常见误读 / 溯源提示\n- 其'低薪高奉献'模式依赖战时民族危机与领袖个人魅力，不可作为常态激励模板；需结合企业史研究评估其可持续边界\n\n## 关联\n- [[张謇]]\n- [[范旭东]]\n- [[梅奥]]\n\n---\n📚 溯源：《卢作孚文集》；民生公司档案；晏阳初、梁漱溟等同时代记述 ｜ 权威等级：一手资料（文集、公司档案）\n"}, {"n": "苏东水", "cn": true, "t": "现代·1931—2021", "sch": "东方管理学派", "lv": "L4", "brief": "三为思想：人为为人", "y": 1931, "body": "---\n姓名: 苏东水\n国别: 中国\n时代: 现代\n生卒/年代: 1931—2021\n思想流派: 东方管理学派\n资料权威等级: 一手资料（本人著作）\n一手资料来源: 苏东水《东方管理学》（复旦大学出版社，多版）；《中国管理通鉴》\ntags: [管理思想, 中国, 现代, 东方管理学派]\n---\n# 苏东水\n\n> **一句话定位**：东方管理学派奠基人，提出'以人为本、以德为先、人为为人'的东方管理三为思想。\n\n## 核心管理思想\n- 三为思想：以人为本（管理的根本）、以德为先（管理的伦理）、人为为人（管理的目的——成就他人）\n- 东方管理学'学、为、治、行、和'五字体系\n- 从《易经》、诸子到近代实业家，构建中国管理思想史的学科框架\n- 管理是\"人为\"的活动，更是\"为人\"的艺术：管理者与被管理者互为主体\n\n## 代表著作 / 一手资料\n- 《东方管理学》；《中国管理通鉴》（四卷本）；《管理学》（复旦版教材）\n\n## 与现代管理的映射\n- 人为为人 → 仆人式领导与利他型组织（东西方汇通）\n- 以德为先 → ESG与商业伦理\n\n## ⚠️ 常见误读 / 溯源提示\n- 东方管理学是20世纪90年代起的学科建构，不是'古已有之的体系'，引用时应定位为现代学术对传统的重构，而非古人原意\n\n## 关联\n- [[流派-中国东方管理学派]]\n- [[曾仕强]]\n- [[孔子]]\n\n---\n📚 溯源：苏东水《东方管理学》（复旦大学出版社，多版）；《中国管理通鉴》 ｜ 权威等级：一手资料（本人著作）\n"}, {"n": "曾仕强", "cn": true, "t": "现代·1934—2018", "sch": "中国式管理", "lv": "L4", "brief": "以电视剧与讲座推行的通俗化中国式管理诠释", "y": 1934, "body": "---\ntags: [存目]\n---\n# 曾仕强\n\n台湾学者，以《易经》与儒家阐发中国式管理（'合理化管理'）。定位为现代通俗诠释，非古义复原——详见 [[03-基因溯源图谱]] 分级规则。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "成思危", "cn": true, "t": "现代·1935—2015", "sch": "管理科学", "lv": "L1", "brief": "软科学推动者，著有《虚拟经济》专著（理论著作，非机构文本）", "y": 1935, "body": "---\n姓名: 成思危\n国别: 中国\n时代: 现代\n生卒/年代: 1935—2015\n思想流派: 管理科学·中国系统工程\n资料权威等级: 一手资料（本人著作、报告）\n一手资料来源: 《成思危论管理》（多卷）；其在中国科学院、国家自然科学基金管理科学部的讲话\ntags: [管理思想, 中国, 现代, 管理科学]\n---\n# 成思危\n\n> **一句话定位**：'中国风险投资之父'，把管理科学、系统工程与虚拟经济研究引入国家决策层。\n\n## 核心管理思想\n- 管理的核心是决策，决策的基础是信息：推动管理科学在国家宏观决策中的应用\n- 复杂系统与软科学研究：主张用系统方法研究经济改革（整体优化而非单点突破）\n- 虚拟经济与风险投资：为中小企业与科技创新设计金融制度供给\n- 管理三个层次：治理（Governance）、管理（Management）、领导（Leadership）各有侧重\n\n## 代表著作 / 一手资料\n- 《成思危论管理》；《成思危论风险投资》；有关虚拟经济系列论文\n\n## 与现代管理的映射\n- 软科学决策 → 政策仿真与智库方法\n- 虚拟经济 → 金融创新的制度设计\n\n## ⚠️ 常见误读 / 溯源提示\n- 其对'虚拟经济'的定义（Fictitious Economy，以票券方式持有权益交易的经济活动）与日常'泡沫/脱实向虚'的贬义用法不同，引用应回到其学术定义\n\n## 关联\n- [[西蒙]]\n- [[伯法]]\n- [[流派-系统学派]]\n\n---\n📚 溯源：《成思危论管理》（多卷）；其在中国科学院、国家自然科学基金管理科学部的讲话 ｜ 权威等级：一手资料（本人著作、报告）\n"}, {"n": "张五常", "cn": true, "t": "现代·1937—", "sch": "新制度经济学应用", "lv": "L1", "brief": "产权与交易费用的经验应用，以《中国的经济制度》建立可检验的制度分析范式", "y": 1937, "body": "---\ntags: [存目]\n---\n# 张五常\n\n华人经济学家，科斯理论的传播与发展者（《企业的合约性质》）。关联：[[科斯]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "任正非", "cn": true, "t": "现代·1944—", "sch": "灰度管理", "lv": "L4", "brief": "熵减、让听得见炮声的人呼唤炮火", "y": 1944, "body": "---\n姓名: 任正非\n国别: 中国\n时代: 现代\n生卒/年代: 1944—\n思想流派: 华为·灰度管理实践\n资料权威等级: 一手资料（讲话、文章，公司出版物）\n一手资料来源: 《任正非文集》（华为心声社区刊发的内部讲话为最接近一手的文本，但经公司编辑部整理）；《华为基本法》\ntags: [管理思想, 中国, 现代, 经验主义]\n---\n# 任正非\n\n> **一句话定位**：以'灰度'哲学把西方流程管理与东方韧性结合，打造出世界级的非上市公司组织样本。\n\n## 核心管理思想\n- 灰度管理：'一个领导人重要的素质是方向、节奏。他的水平就是合适的灰度'——拒绝非黑即白\n- 以客户为中心，以奋斗者为本，长期艰苦奋斗：价值观即制度（《华为基本法》1998）\n- 熵减理论：用耗散结构对抗组织惰怠——'封闭系统必然熵增'，持续引入能量与开放\n- 让听得见炮声的人呼唤炮火：一线决策授权与前中后台协同\n- 自我批判机制：把组织纠错制度化（华为'蓝军'参谋部）\n\n## 代表著作 / 一手资料\n- 《华为基本法》；任正非历年内部讲话（心声社区汇编）；电邮文集\n\n## 与现代管理的映射\n- 灰度 → 权变理论与情境判断\n- 熵减 → 组织学习与变革管理\n- 呼唤炮火 → 授权与前线决策\n\n## ⚠️ 常见误读 / 溯源提示\n- 市面《任正非传》多为未经本人授权的二手写作；其思想应优先引用心声社区原文与《华为基本法》，凡'语录体'畅销书引文需谨慎对待\n\n## 关联\n- [[德鲁克]]\n- [[菲德勒]]\n\n---\n📚 溯源：《任正非文集》（华为心声社区刊发的内部讲话为最接近一手的文本，但经公司编辑部整理）；《华为基本法》 ｜ 权威等级：一手资料（讲话、文章，公司出版物）\n"}, {"n": "黄铁鹰", "cn": true, "t": "现代·1953—", "sch": "企业实务", "lv": "L3", "brief": "通用航空与《中国企业家》调查写作，《中国企业制度创新》为企业案例二手研究", "y": 1953, "body": "---\ntags: [存目]\n---\n# 黄铁鹰\n\n《海底捞你学不会》作者（北大光华教授），海底捞案例研究者。\n\n> ⚑ 存目桩页：为保持图谱连通而设，待展开。"}, {"n": "雷军", "cn": true, "t": "现代·1969—", "sch": "互联网创业", "lv": "L2", "brief": "聚焦战略与用户参与的高频迭代创业范式", "y": 1969, "body": "---\ntags: [存目]\n---\n# 雷军\n\n小米创始人：扁平化与生态链实践见 [[经验-小米-扁平化与生态链]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，待展开。"}, {"n": "马化腾", "cn": true, "t": "现代·1971—", "sch": "平台治理", "lv": "L2", "brief": "连接与开放（Open/Share）理念下的平台型组织设计", "y": 1971, "body": "---\ntags: [存目]\n---\n# 马化腾\n\n腾讯创始人：灰度法则与赛马机制。\n\n> ⚑ 存目桩页：为保持图谱连通而设，待展开。"}, {"n": "苏格拉底", "cn": false, "t": "古希腊·约前470—前399", "sch": "古希腊哲学", "lv": "L1", "brief": "提问法：对话式审问以暴露隐含假设（管理咨询的古典源头）", "y": -470, "body": "---\ntags: [存目]\n---\n# 苏格拉底\n\n苏格拉底式追问是管理学案例教学的源头。其经济思想经色诺芬《经济论》传世。见 [[色诺芬]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "色诺芬", "cn": false, "t": "古希腊·约前430—前355", "sch": "古典经济", "lv": "L1", "brief": "分工论与\"经济\"一词的西方词源", "y": -430, "body": "---\n姓名: 色诺芬\n国别: 外国\n时代: 古希腊\n生卒/年代: 约前430—前354\n思想流派: 古典经济管理\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《经济论》（Oeconomicus，苏格拉底式对话体）；《居鲁士的教育》\ntags: [管理思想, 外国, 古代, 古典]\n---\n# 色诺芬\n\n> **一句话定位**：“经济”一词的词源即出自其书名，最早讨论分工与管理的教育功能。\n\n## 核心管理思想\n- 劳动分工与专业化：鞋匠只做鞋会更熟练、质量更高——比亚当·斯密早2300年提出分工论\n- 管理是一门可教可学的技艺：好管家需兼具农业、会计、用人等系统知识\n- 对驯服之物进行管理比管理狂野者更令人愉快——尊重被管理者\n- 以荣誉与物质双轨激励最能干的监工\n\n## 代表著作 / 一手资料\n- 《经济论》；《居鲁士的教育》；《长征记》\n\n## 与现代管理的映射\n- 分工论 → 斯密与泰勒的共同源头\n- 监工与激励 → 督导制度与激励组合\n\n## ⚠️ 常见误读 / 溯源提示\n- 其分工论述针对家庭奴隶制经济而非工厂制度，直接称其为“科学管理先驱”是时代错置，宜称“思想渊源”\n\n## 关联\n- [[亚当·斯密]]\n- [[苏格拉底]]\n- [[柏拉图]]\n\n---\n📚 溯源：《经济论》（Oeconomicus，苏格拉底式对话体）；《居鲁士的教育》 ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "柏拉图", "cn": false, "t": "古希腊·约前427—前347", "sch": "古希腊哲学", "lv": "L1", "brief": "《理想国》分工与三等级：组织分层与\"专家治国\"的原型", "y": -427, "body": "---\ntags: [存目]\n---\n# 柏拉图\n\n《理想国》中的分工与等级秩序是组织设计的古典先声。见 [[色诺芬]] [[孔子]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "马基雅维利", "cn": false, "t": "文艺复兴·1469—1527", "sch": "政治现实主义", "lv": "L1", "brief": "以人性恶为前提的权力制度设计", "y": 1469, "body": "---\n姓名: 马基雅维利\n国别: 外国\n时代: 文艺复兴\n生卒/年代: 1469—1527\n思想流派: 政治现实主义\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《君主论》（Il Principe, 1532年出版）；《李维史论》\ntags: [管理思想, 外国, 近代, 经验主义]\n---\n# 马基雅维利\n\n> **一句话定位**：把组织权力当作独立对象进行冷峻分析的第一人。\n\n## 核心管理思想\n- 目的与手段分离：政治行为的评价标准是后果与存续，而非道德纯洁\n- virtù与fortuna：领导者的能力（果断、灵活、欺骗的正当性）对抗环境运气\n- 以人性恶为前提设计制度：假设人会背信，制度要有威慑与制衡\n- 狐狸与狮子：领导者需兼具识别陷阱的智与震慑豺狼的力\n- 被畏惧比被爱戴更安全，但绝不能被憎恨——情感管理的临界点\n\n## 代表著作 / 一手资料\n- 《君主论》；《李维史论》；《战争的艺术》\n\n## 与现代管理的映射\n- 人性假设 → X理论与制度激励设计\n- virtù → 领导力与情境适应\n\n## ⚠️ 常见误读 / 溯源提示\n- “马基雅维利主义”（权术不择手段）是后世心理学标签，其原著语境是城邦生存政治学，引用应区分“政治现实主义分析”与“日常权谋”\n\n## 关联\n- [[韩非子]]\n- [[麦格雷戈]]\n\n---\n📚 溯源：《君主论》（Il Principe, 1532年出版）；《李维史论》 ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "亚当·斯密", "cn": false, "t": "近代·1723—1790", "sch": "古典经济", "lv": "L1", "brief": "分工+看不见的手", "y": 1723, "body": "---\n姓名: 亚当·斯密\n国别: 外国\n时代: 工业革命前夜\n生卒/年代: 1723—1790\n思想流派: 古典经济学\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《国富论》（1776）；《道德情操论》（1759）\ntags: [管理思想, 外国, 近代, 古典]\n---\n# 亚当·斯密\n\n> **一句话定位**：“看不见的手”揭示市场自协调机制，分工理论成为管理科学化的第一块基石。\n\n## 核心管理思想\n- 劳动分工：制针工场例证，分工带来熟练度、节省转换时间、促进机器发明\n- 看不见的手：个体逐利经市场协调转化为公共福祉——自发秩序理论\n- 经纪人假设：人主要受自利驱动，但斯密同时强调“同情心”（《道德情操论》）\n- 守夜人国家：政府限于国防、司法、公共工程——市场边界论\n\n## 代表著作 / 一手资料\n- 《国民财富的性质和原因的研究》（《国富论》）；《道德情操论》\n\n## 与现代管理的映射\n- 分工 → 泰罗制与流水线组织设计的理论基础\n- 自发秩序 → 平台治理与去中心化\n\n## ⚠️ 常见误读 / 溯源提示\n- 被窄化为“人都是自私的”：斯密伦理学基础恰是同情与合宜感，《道德情操论》与《国富论》互为表里，只引《国富论》是断章取义\n\n## 关联\n- [[色诺芬]]\n- [[查尔斯·巴贝奇]]\n- [[马歇尔]]\n\n---\n📚 溯源：《国富论》（1776）；《道德情操论》（1759） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "罗伯特·欧文", "cn": false, "t": "近代·1771—1858", "sch": "人本管理", "lv": "L1", "brief": "新拉纳克：环境塑造人", "y": 1771, "body": "---\n姓名: 罗伯特·欧文\n国别: 外国\n时代: 工业革命\n生卒/年代: 1771—1858\n思想流派: 空想社会主义·人本管理\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《论性格的形成》（1813/1816）；新拉纳克工厂报告与演讲集\ntags: [管理思想, 外国, 近代, 行为科学]\n---\n# 罗伯特·欧文\n\n> **一句话定位**：新拉纳克纱厂实验：人是环境的产物，工厂主可以兼做人本主义者。\n\n## 核心管理思想\n- 性格形成说：人的善恶由环境塑造，改造环境即改造人——行为科学的哲学根基\n- 新拉纳克实验：缩短工时（10.5小时）、禁童工、建学校与商店、发医疗——福利资本主义的源头\n- 环境即机器：你们可以把人当机器，但他们是会思考的机器——人的因素进入管理视野\n- 教育与法规优于惩罚：影响工人行为的三大动力之首\n\n## 代表著作 / 一手资料\n- 《论性格的形成》；《新社会观》（1813—1816系列论文）\n\n## 与现代管理的映射\n- 环境决定论 → 组织行为学的情境视角\n- 福利制度 → EHS与员工福祉体系\n\n## ⚠️ 常见误读 / 溯源提示\n- 被贴上“空想社会主义”标签后，其企业管理成就（新拉纳克盈利且成为工业旅游胜地）常被忽视，其是“人本管理”的实证起点\n\n## 关联\n- [[梅奥]]\n- [[弗雷德里克·泰勒]]\n- [[马克思]]\n\n---\n📚 溯源：《论性格的形成》（1813/1816）；新拉纳克工厂报告与演讲集 ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "查尔斯·巴贝奇", "cn": false, "t": "近代·1791—1871", "sch": "科学管理先驱", "lv": "L1", "brief": "时间研究+差额工资预见", "y": 1791, "body": "---\n姓名: 查尔斯·巴贝奇\n国别: 外国\n时代: 工业革命\n生卒/年代: 1791—1871\n思想流派: 科学管理先驱\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《论机器和制造业的经济》（On the Economy of Machinery and Manufactures, 1832）\ntags: [管理思想, 外国, 近代, 科学管理]\n---\n# 查尔斯·巴贝奇\n\n> **一句话定位**：计算机之父，同时是“时间—动作研究+差额工资”的完整预见者，泰勒的先驱。\n\n## 核心管理思想\n- 时间研究：用秒表计时分析制针工序，分解动作时间（早于吉尔布雷斯70年）\n- 分工的智力化：把脑力劳动也纳入分工，主张雇用第一流的工人\n- 差额工资：按技能与工作表现分级付酬——差别计件工资的原型\n- 成本核算：详细分析原材料、工具、工时成本，主张用数据管理工厂\n\n## 代表著作 / 一手资料\n- 《论机器和制造业的经济》（1832）；《机械数学分析引擎》笔记\n\n## 与现代管理的映射\n- 时间研究 → 泰罗制直接源头\n- 成本核算 → 管理会计与作业成本法\n\n## ⚠️ 常见误读 / 溯源提示\n- 常被仅记为“计算机先驱”，其管理贡献在管理思想史中（如丹尼尔·雷恩《管理思想史》）有专章，引用其思想应回到1832年原著\n\n## 关联\n- [[亚当·斯密]]\n- [[弗雷德里克·泰勒]]\n- [[吉尔布雷斯夫妇]]\n\n---\n📚 溯源：《论机器和制造业的经济》（On the Economy of Machinery and Manufactures, 1832） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "马克思", "cn": false, "t": "近代·1818—1883", "sch": "批判政治经济学", "lv": "L1", "brief": "剩余价值与资本积累：组织中的技术进步如何异化劳动者", "y": 1818, "body": "---\ntags: [存目]\n---\n# 马克思\n\n对劳动分工的批判性分析（《资本论》工场手工业章节）是研究分工异化的必读视角。见 [[亚当·斯密]] [[罗伯特·欧文]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "马歇尔", "cn": false, "t": "近代·1842—1924", "sch": "新古典经济学/剑桥学派", "lv": "L1", "brief": "《经济学原理》初版1870、五版1890：以局部均衡与弹性工具把经济学推向应用", "y": 1842, "body": "---\ntags: [存目]\n---\n# 马歇尔\n\n新古典经济学：组织作为'内部经济'的分析，连接斯密与科斯。见 [[亚当·斯密]] [[科斯]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "亨利·法约尔", "cn": false, "t": "近代·1841—1925", "sch": "管理过程", "lv": "L1", "brief": "五职能+14原则", "y": 1841, "body": "---\n姓名: 亨利·法约尔\n国别: 外国\n时代: 古典管理\n生卒/年代: 1841—1925\n思想流派: 管理过程学派\n资料权威等级: 一手资料（原典传世，译本需注意转译链）\n一手资料来源: 《工业管理与一般管理》（Administration Industrielle et Générale, 1916法文原版；1929英译本；1982周安华等中译本依英译本转译——研究应注明版本链条）\ntags: [管理思想, 外国, 现代, 管理过程]\n---\n# 亨利·法约尔\n\n> **一句话定位**：“一般管理理论之父”，把管理从工厂经验上升为所有组织通用的一般职能。\n\n## 核心管理思想\n- 管理五职能：计划、组织、指挥、协调、控制——POSDCORB的原型\n- 14条管理原则：劳动分工、权力与责任、纪律、统一指挥、统一领导、个人利益服从整体、报酬公平、集权化、等级链、秩序、公平、人员稳定、首创精神、团队精神\n- 管理能力可经教育获得：开管理教育之先\n- 等级链与“法约尔跳板”：紧急时同级可跨部门沟通（横向沟通制度的雏形）\n- 组织六项活动：技术、商业、财务、安全、会计、管理——管理只是其一\n\n## 代表著作 / 一手资料\n- 《工业管理与一般管理》（1916法文原版）；《国家管理理论》（1923演讲）\n\n## 与现代管理的映射\n- 五职能 → 一切管理学教材的骨架\n- 14原则 → 组织设计基本原则清单\n- 跳板 → 跨部门协作机制\n\n## ⚠️ 常见误读 / 溯源提示\n- ①“统一指挥”（unité de commandement，一人只听一个上级）与“统一领导”（unité de direction，一组活动只有一个目标一个计划）中文常被混译，研究需对照法文原文；②中译本多从英译本转译，术语有偏差，关键引用建议标注法文词\n\n## 关联\n- [[马克斯·韦伯]]\n- [[孔茨]]\n- [[流派-管理过程]]\n- [[穆藕初]]\n\n---\n📚 溯源：《工业管理与一般管理》（Administration Industrielle et Générale, 1916法文原版；1929英译本；1982周安华等中译本依英译本转译——研究应注明版本链条） ｜ 权威等级：一手资料（原典传世，译本需注意转译链）\n"}, {"n": "帕累托", "cn": false, "t": "近代·1848—1923", "sch": "精英循环/帕累托法则", "lv": "L1", "brief": "80/20 不平等分布与精英循环：《政治经济学讲义》", "y": 1848, "body": "---\ntags: [存目]\n---\n# 帕累托\n\n帕累托法则（二八定律）提出者，朱兰将其引入质量管理。关联：[[朱兰]]\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "哈林顿·埃默森", "cn": false, "t": "近代·1853—1931", "sch": "效率原则", "lv": "L1", "brief": "效率十二原则+直线参谋制", "y": 1853, "body": "---\n姓名: 哈林顿·埃默森\n国别: 外国\n时代: 古典管理\n生卒/年代: 1853—1931\n思想流派: 科学管理·效率原则\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《效率的十二原则》（Twelve Principles of Efficiency, 1911）；《科学地挑选雇员》（1914）\ntags: [管理思想, 外国, 现代, 科学管理]\n---\n# 哈林顿·埃默森\n\n> **一句话定位**：“效率的大祭司”，把泰勒的车间方法扩展为全组织效率原则体系。\n\n## 核心管理思想\n- 效率十二原则：明确目标、常识、有能力的顾问、纪律、公平、可靠记录、调度、标准日程、标准化环境、标准化操作、书面标准、效率奖励\n- 直线—参谋组织：职能部门只当参谋不直接指挥——直线职能制组织图的原型\n- 效率的终极检验是福利的增长——效率运动的人本面\n\n## 代表著作 / 一手资料\n- 《效率的十二原则》（1911）；《科学地挑选雇员》（1914）\n\n## 与现代管理的映射\n- 十二原则 → 管理体系审核的雏形\n- 直线—参谋 → 现代组织架构图原型\n\n## ⚠️ 常见误读 / 溯源提示\n- 其效率原则常被当作泰勒制的注脚，实际影响超出车间，直接塑造了美国铁路与军队管理体系\n\n## 关联\n- [[弗雷德里克·泰勒]]\n- [[亨利·法约尔]]\n\n---\n📚 溯源：《效率的十二原则》（Twelve Principles of Efficiency, 1911）；《科学地挑选雇员》（1914） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "弗雷德里克·泰勒", "cn": false, "t": "近代·1856—1915", "sch": "科学管理", "lv": "L1", "brief": "四原则+差别计件+心理革命", "y": 1856, "body": "---\n姓名: 弗雷德里克·泰勒\n国别: 外国\n时代: 古典管理\n生卒/年代: 1856—1915\n思想流派: 科学管理学派\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《科学管理原理》（The Principles of Scientific Management, 1911，国会听证版1912为最佳读本）\ntags: [管理思想, 外国, 现代, 科学管理]\n---\n# 弗雷德里克·泰勒\n\n> **一句话定位**：“科学管理之父”，把工作从经验艺术变为可测量、可标准化的科学。\n\n## 核心管理思想\n- 科学管理四原则：①科学方法取代经验法则 ②科学地选拔与培训工人 ③管理者与工人衷心合作 ④管理者承担计划职能\n- 时间研究与动作研究：秒表+分解动作，确定一流工人的日工作量\n- 差别计件工资：超定额高单价、未完成低单价——用薪酬放大产出差异\n- 职能工长制：八个专业职能工长代替单一班组长（多头领导，后证明行不通）\n- 心理革命：劳资双方把注意力从盈余分配转向共同做大盈余——效率与人性并重的管理哲学\n\n## 代表著作 / 一手资料\n- 《科学管理原理》（1911）；《计件工资制》（1895）；《车间管理》（1903）；国会证词（1912）\n\n## 与现代管理的映射\n- 标准化 → ISO与SOP体系\n- 时间与动作研究 → 工业工程与精益\n- 心理革命 → 劳资共赢与利益相关者理论\n\n## ⚠️ 常见误读 / 溯源提示\n- 常被误读为“把工人当机器的压榨者”：泰勒原文反复强调“以最大限度的富裕代替最小限度的富裕”，并认为最大受益者应是工人；1912年国会听证记录是其人本面最好的第一手证据。另一误区：“泰勒制=流水线”，流水线是福特对泰勒方法的应用\n\n## 关联\n- [[吉尔布雷斯夫妇]]\n- [[亨利·甘特]]\n- [[哈林顿·埃默森]]\n- [[穆藕初]]\n- [[查尔斯·巴贝奇]]\n\n---\n📚 溯源：《科学管理原理》（The Principles of Scientific Management, 1911，国会听证版1912为最佳读本） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "亨利·甘特", "cn": false, "t": "近代·1861—1919", "sch": "科学管理", "lv": "L1", "brief": "甘特图：把计划进度可视化（1915年提出）", "y": 1861, "body": "---\n姓名: 亨利·甘特\n国别: 外国\n时代: 古典管理\n生卒/年代: 1861—1919\n思想流派: 科学管理·可视化控制\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《工作、工资和利润》（Work, Wages, and Profits, 1910）；《工业的领导》（1916）\ntags: [管理思想, 外国, 现代, 科学管理]\n---\n# 亨利·甘特\n\n> **一句话定位**：甘特图的发明者，任务—时间—责任可视化的第一人。\n\n## 核心管理思想\n- 甘特图：横轴时间、纵轴任务，直观显示计划与实际进度——项目管理的原生工具\n- 任务加奖金制：工人完成日任务得奖金，工长因工人达标也得奖金——最早的管理者激励\n- 重视训练与教导而非惩罚：习惯与教训管理理念\n\n## 代表著作 / 一手资料\n- 《工作、工资和利润》（1910）；《工业的领导》（1916）；甘特图论文（1903）\n\n## 与现代管理的映射\n- 甘特图 → 项目管理软件的通用语言\n- 管理者连带奖金 → 团队激励与利润分享\n\n## ⚠️ 常见误读 / 溯源提示\n- 甘特图被当作“通用图表”后，其背后的“控制=对比计划与实际”的管理哲学（控制论前身）常被忽略\n\n## 关联\n- [[弗雷德里克·泰勒]]\n- [[吉尔布雷斯夫妇]]\n- [[控制]]\n\n---\n📚 溯源：《工作、工资和利润》（Work, Wages, and Profits, 1910）；《工业的领导》（1916） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "马克斯·韦伯", "cn": false, "t": "近代·1864—1920", "sch": "科层制", "lv": "L2", "brief": "三种权威+理性行政", "y": 1864, "body": "---\n姓名: 马克斯·韦伯\n国别: 外国\n时代: 古典管理\n生卒/年代: 1864—1920\n思想流派: 科层制·组织社会学\n资料权威等级: 一手资料（原典传世，手稿经遗孀整理出版，需注意版本）\n一手资料来源: 《经济与社会》（Wirtschaft und Gesellschaft，1922遗著，由玛丽安妮·韦伯整理出版）；《新教伦理与资本主义精神》（1904/05）\ntags: [管理思想, 外国, 现代, 科层制]\n---\n# 马克斯·韦伯\n\n> **一句话定位**：“组织理论之父”，科层制是理性化（Rationalisierung）在组织中的最高形态。\n\n## 核心管理思想\n- 三种权威类型：传统型、魅力型、理性-合法型——科层制建立在第三种之上\n- 科层制六特征：层级节制、专业化分工、照章办事、非人格化、档案化、依专业资格任用\n- 理性化与“铁笼”：工具理性扩张带来的现代性困境——效率与人性自由的张力\n- 新教伦理：勤俭、天职观塑造资本主义精神——文化影响经济的经典论证\n\n## 代表著作 / 一手资料\n- 《经济与社会》（1922）；《新教伦理与资本主义精神》（1904/05）；《学术与政治》（1919演讲）\n\n## 与现代管理的映射\n- 科层制 → 现代行政组织与大公司的基本骨架\n- 权威类型 → 领导力合法性分析框架\n\n## ⚠️ 常见误读 / 溯源提示\n- ①“官僚”在现代汉语中是贬义，韦伯的Bürokratie是价值中性的“理性行政”，含褒义；②“铁笼”（stahlhartes Gehäuse，英译iron cage）本义更近“钢壳”，中译“铁笼”已约定俗成但意象偏重\n\n## 关联\n- [[亨利·法约尔]]\n- [[韩非子]]\n- [[默顿]]\n\n---\n📚 溯源：《经济与社会》（Wirtschaft und Gesellschaft，1922遗著，由玛丽安妮·韦伯整理出版）；《新教伦理与资本主义精神》（1904/05） ｜ 权威等级：一手资料（原典传世，手稿经遗孀整理出版，需注意版本）\n"}, {"n": "吉尔布雷斯夫妇", "cn": false, "t": "近代·1868—1924 / 1878—1972", "sch": "动作研究", "lv": "L1", "brief": "动素分析+第一部管理心理学", "y": 1868, "body": "---\n姓名: 吉尔布雷斯夫妇\n国别: 外国\n时代: 古典管理\n生卒/年代: 1868—1924 / 1878—1972\n思想流派: 科学管理·动作研究\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 弗兰克·吉尔布雷斯《动作研究》（Motion Study, 1911）；莉莲·吉尔布雷斯《管理心理学》（Psychology of Management, 1914）——第一部管理心理学著作\ntags: [管理思想, 外国, 现代, 科学管理]\n---\n# 吉尔布雷斯夫妇\n\n> **一句话定位**：“动作研究之父与第一位管理心理学家”的夫妻档，把动素（therblig）分析推向极致。\n\n## 核心管理思想\n- 动素分析：把作业分解为17种基本动素（伸手、抓取、移动等），逐一消除浪费\n- 微动作研究（cyclograph）：用灯与摄像机记录运动轨迹\n- 动作经济原则：双手同时动作、减少动作距离、利用重力——人体工学的先声\n- 莉莲把心理学引入管理：管理的未来在于人，工人疲劳与动机研究\n- 家庭即实验室：把12个孩子按动作研究做家庭管理实验\n\n## 代表著作 / 一手资料\n- 《动作研究》（1911）；《管理心理学》（1914）；《疲劳研究》（1916）\n\n## 与现代管理的映射\n- 动素 → 工业工程与动作经济原则\n- 管理心理学 → 组织行为学学科起点\n\n## ⚠️ 常见误读 / 溯源提示\n- 二人贡献常被混记为“泰勒追随者”，实则动作研究与时间研究相互独立；莉莲·吉尔布雷斯是管理心理学第一位博士（布朗大学1915）\n\n## 关联\n- [[弗雷德里克·泰勒]]\n- [[亨利·甘特]]\n- [[梅奥]]\n\n---\n📚 溯源：弗兰克·吉尔布雷斯《动作研究》（Motion Study, 1911）；莉莲·吉尔布雷斯《管理心理学》（Psychology of Management, 1914）——第一部管理心理学著作 ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "斯隆", "cn": false, "t": "近代·1875—1966", "sch": "事业部制", "lv": "L2", "brief": "联邦分权：政策集中运营分散", "y": 1875, "body": "---\n姓名: 斯隆\n国别: 外国\n时代: 企业实践\n生卒/年代: 1875—1966\n思想流派: 事业部制·分权管理\n资料权威等级: 一手资料（回忆录+档案）\n一手资料来源: 《我在通用汽车的岁月》（My Years with General Motors, 1963）；通用与哈佛档案库\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 斯隆\n\n> **一句话定位**：通用汽车舵手，事业部制与“政策制定与行政管理分离”组织设计的实践原型。\n\n## 核心管理思想\n- 事业部制：政策集中、运营分散——各事业部独立核算并对利润负责\n- 联邦分权制：公司总部管战略与财务，事业部管日常运营（钱德勒《战略与结构》的主角）\n- 协调机制：运营委员会、财务委员会与拨款程序——分权不失控的制度设计\n- 产品市场细分战略（各阶层、各用途都有车——对福特单一产品模式的战略反击）\n\n## 代表著作 / 一手资料\n- 《我在通用汽车的岁月》（1963）\n\n## 与现代管理的映射\n- 事业部制 → 集团管控与利润中心\n- 联邦分权 → 母子公司治理\n\n## ⚠️ 常见误读 / 溯源提示\n- 其回忆录写作带有为管理史立范的自我建构色彩（德鲁克曾为其写作提供建议），使用时应与档案研究（如钱德勒）互证\n\n## 关联\n- [[钱德勒]]\n- [[德鲁克]]\n- [[事业部制]]\n\n---\n📚 溯源：《我在通用汽车的岁月》（My Years with General Motors, 1963）；通用与哈佛档案库 ｜ 权威等级：一手资料（回忆录+档案）\n"}, {"n": "梅奥", "cn": false, "t": "近代·1880—1949", "sch": "人际关系", "lv": "L3", "brief": "霍桑实验：社会人与非正式组织（实验设计与因果链受学界质疑）", "y": 1880, "body": "---\n姓名: 梅奥\n国别: 外国\n时代: 行为科学\n生卒/年代: 1880—1949\n思想流派: 人际关系学派\n资料权威等级: 一手资料（原典+争议并存）\n一手资料来源: 《工业文明中人的问题》（The Human Problems of an Industrial Civilization, 1933）；《工业文明中的社会问题》（1945）。实验原始数据存哈佛商学院档案\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 梅奥\n\n> **一句话定位**：霍桑实验的主持者，“人际关系运动”之父，把人正式请进管理学。\n\n## 核心管理思想\n- 霍桑实验四阶段：照明实验（1924-27）、继电器装配测试室、访谈计划（2万余人次）、接线板观察\n- 主要结论：工人是社会人而非单纯经济人；企业中存在非正式组织；士气与满意度显著影响产出\n- 访谈疗法：倾诉本身即能提高满意度——员工沟通渠道的价值\n- 群氓假设批判：拆散工作小组会瓦解协作，人需要群体归属\n\n## 代表著作 / 一手资料\n- 《工业文明中人的问题》（1933）；《工业文明中的社会问题》（1945）\n\n## 与现代管理的映射\n- 非正式组织 → 组织网络分析与企业文化\n- 访谈计划 → 员工敬业度调查的起源\n\n## ⚠️ 常见误读 / 溯源提示\n- ①霍桑实验数据后世遭强烈质疑（如H. M. Parsons 1974指出接线板小组自设产量规范可能是主因），霍桑效应与实验结论的因果链并不牢靠；②梅奥对工业文明的悲观解读带有时代色彩，引用时应说明其理论化成分高于纯实验证据\n\n## 关联\n- [[切斯特·巴纳德]]\n- [[马斯洛]]\n- [[人际关系学派]]\n- [[霍桑实验]]\n\n---\n📚 溯源：《工业文明中人的问题》（The Human Problems of an Industrial Civilization, 1933）；《工业文明中的社会问题》（1945）。实验原始数据存哈佛商学院档案 ｜ 权威等级：一手资料（原典+争议并存）\n"}, {"n": "切斯特·巴纳德", "cn": false, "t": "近代·1886—1961", "sch": "社会系统", "lv": "L1", "brief": "组织是协作系统、权威接受论", "y": 1886, "body": "---\n姓名: 切斯特·巴纳德\n国别: 外国\n时代: 1930年代\n生卒/年代: 1886—1961\n思想流派: 社会系统学派\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《经理人员的职能》（The Functions of the Executive, 1938）——美国管理学会评选的“最有影响力的管理著作”\ntags: [管理思想, 外国, 现代, 社会系统]\n---\n# 切斯特·巴纳德\n\n> **一句话定位**：从新泽西贝尔电话公司总裁办公桌写出的组织理论：组织是协作系统。\n\n## 核心管理思想\n- 组织定义：有意识地协调两个或两个以上人的活动或力量的系统——组织是协作不是结构图\n- 协作三要素：协作意愿、共同目标、信息交流\n- 诱因—贡献平衡：成员贡献与组织诱因（薪酬、荣誉、意义感）的平衡决定协作存续\n- 权威接受论：命令只有被下属接受才成为权威——权威自下而上生成（与韦伯自上而下互补）\n- 非正式组织三功能：信息传递、凝聚力维护、维持自\n\n## 代表著作 / 一手资料\n- 《经理人员的职能》（1938）；《组织与管理》（1948文集）\n\n## 与现代管理的映射\n- 权威接受论 → 赋能型组织与心理契约\n- 非正式组织 → 梅奥霍桑结论的理论化\n\n## ⚠️ 常见误读 / 溯源提示\n- 其书因抽象难读长期被低估（初版仅印千余册），后被西蒙等重新发现——阅读时应配合其通信集理解思想演变\n\n## 关联\n- [[西蒙]]\n- [[梅奥]]\n- [[马克斯·韦伯]]\n\n---\n📚 溯源：《经理人员的职能》（The Functions of the Executive, 1938）——美国管理学会评选的“最有影响力的管理著作” ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "库尔特·勒温", "cn": false, "t": "近代·1890—1947", "sch": "群体动力", "lv": "L1", "brief": "力场分析+解冻变革再冻结", "y": 1890, "body": "---\n姓名: 库尔特·勒温\n国别: 外国\n时代: 行为科学\n生卒/年代: 1890—1947\n思想流派: 群体动力学·变革模型\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《群体动力学前沿》（Frontiers in Group Dynamics, 1947）；《行动研究与少数群体问题》（1946）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 库尔特·勒温\n\n> **一句话定位**：群体动力学之父，用力场分析与“解冻—变革—再冻结”奠定变革管理方法论。\n\n## 核心管理思想\n- 力场分析：变革=驱动力与制约力的净差，增强驱动或削弱制约而非硬推\n- 解冻—变革—再冻结三阶段（与利皮特合作）：先松动旧认知，再导入新行为，最后固化\n- 行动研究（Action Research）：研究者与实践者合作，没有无研究的变化，也没有无变化的研究\n- 领导风格实验（1939）：专制、民主、放任——最早用实验方法研究领导\n- 群体规范：群体比个体更能施加压力——非正式规范的约束力\n\n## 代表著作 / 一手资料\n- 1947《群体动力学前沿》；1946《行动研究与少数群体问题》；1939领导风格实验报告\n\n## 与现代管理的映射\n- 力场分析 → 变革阻力诊断工具\n- 三阶段 → 所有变革管理流程的母版\n- 行动研究 → 敏捷组织与复盘文化\n\n## ⚠️ 常见误读 / 溯源提示\n- 其研究以美国社会心理学小型群体为背景，迁移到大型组织需修正；“再冻结”在快速变化时代被“持续变革”修正，但其结构思想仍被使用\n\n## 关联\n- [[梅奥]]\n- [[科特]]\n- [[组织变革]]\n\n---\n📚 溯源：《群体动力学前沿》（Frontiers in Group Dynamics, 1947）；《行动研究与少数群体问题》（1946） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "休哈特", "cn": false, "t": "近代·1891—1967", "sch": "统计质量控制", "lv": "L1", "brief": "控制图与统计过程控制：PDCA 的源头（戴明自谦为转述）", "y": 1891, "body": "---\ntags: [存目]\n---\n# 休哈特\n\n统计过程控制之父：控制图与 PDCA 循环（戴明环）的真正提出者。关联：[[戴明]]\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "哈耶克", "cn": false, "t": "近代·1899—1992", "sch": "奥地利学派/自发秩序", "lv": "L1", "brief": "价格作为信息：市场是自发秩序而非可设计机制", "y": 1899, "body": "---\ntags: [存目]\n---\n# 哈耶克\n\n自发秩序（spontaneous order）与知识分工：价格体系是分布式信息系统。与老子'无为'、斯密'看不见的手'构成自组织思想的三足。见 [[亚当·斯密]] [[老子]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设。"}, {"n": "戴明", "cn": false, "t": "近代·1900—1993", "sch": "质量管理", "lv": "L2", "brief": "十四点+PDCA 在日本传播转述（非其原创）", "y": 1900, "body": "---\n姓名: 戴明\n国别: 外国\n时代: 质量管理\n生卒/年代: 1900—1993\n思想流派: 质量管理·日本经济奇迹的导师\n资料权威等级: 一手资料（原典+其思想在日本经再创造）\n一手资料来源: 《转危为安》（Out of the Crisis, 1982）；《新经济学》（The New Economics, 1993）；1950年在日本系列讲义\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 戴明\n\n> **一句话定位**：被日本天皇授予二等瑞宝章的美国统计学家，PDCA与十四点的作者。\n\n## 核心管理思想\n- 十四点管理原则：创造恒久目标、采纳新哲学、停止依靠检验求质量（把质量做进过程）、驱走恐惧、打破部门墙等\n- PDCA循环：计划—执行—检查—处理（源自休哈特循环，日称戴明环）\n- 深刻的知识体系：系统、变异（统计方法）、知识理论、心理学四合一\n- 变异管理：区分共同原因与特殊原因——没有数据，你只是另一个有观点的人\n- 员工是系统的产物：90%的质量问题出在系统而非个人——对泰勒制的修正\n\n## 代表著作 / 一手资料\n- 《转危为安》（1982）；《新经济学》（1993）\n\n## 与现代管理的映射\n- PDCA → 敏捷迭代与持续改善（Kaizen）\n- 十四点 → 全面质量管理（TQM）纲领\n\n## ⚠️ 常见误读 / 溯源提示\n- ①PDCA源自休哈特（Shewhart）循环，戴明自谦为转述，后世冠名需注明谱系；②戴明晚年对日本品质国是的贡献远大于其在美国本土的待遇，其思想的全球旅行是管理思想史的经典案例（可与穆藕初引泰勒入华对读）\n\n## 关联\n- [[弗雷德里克·泰勒]]\n- [[朱兰]]\n- [[丰田生产方式]]\n- [[休哈特]]\n\n---\n📚 溯源：《转危为安》（Out of the Crisis, 1982）；《新经济学》（The New Economics, 1993）；1950年在日本系列讲义 ｜ 权威等级：一手资料（原典+其思想在日本经再创造）\n"}, {"n": "贝塔朗菲", "cn": false, "t": "近代·1901—1987", "sch": "一般系统理论", "lv": "L1", "brief": "一般系统论：以等值方程把生物与社会系统统一为可测系统", "y": 1901, "body": "---\ntags: [存目]\n---\n# 贝塔朗菲\n\n一般系统论创始人，卡斯特、圣吉的理论源头。见 [[卡斯特与罗森茨韦克]] [[圣吉]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "朱兰", "cn": false, "t": "近代·1904—2008", "sch": "质量管理", "lv": "L1", "brief": "质量三部曲+帕累托质量法则", "y": 1904, "body": "---\n姓名: 朱兰\n国别: 外国\n时代: 质量管理\n生卒/年代: 1904—2008\n思想流派: 质量管理\n资料权威等级: 一手资料（原典）\n一手资料来源: 《质量控制手册》（Quality Control Handbook, 1951初版，多版修订）；《朱兰自传》（2004）\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 朱兰\n\n> **一句话定位**：质量三部曲（质量策划—质量控制—质量改进）的作者，把质量定义为“适用性”。\n\n## 核心管理思想\n- 质量=适用性（Fitness for Use）：质量由顾客而非工程师定义\n- 质量三部曲：质量策划（确定顾客与过程）、质量控制（监测与纠偏）、质量改进（突破常态绩效）\n- 80/20质量法则：80%的质量问题源于管理层可控的系统缺陷，仅20%源于一线工人——质量责任在管理层\n- 关键少数与次要多数：帕累托法则在质量改进中的应用\n\n## 代表著作 / 一手资料\n- 《质量控制手册》（1951起多版）；《朱兰质量手册》；《朱兰自传》\n\n## 与现代管理的映射\n- 三部曲 → 质量职能分工与六西格玛DMAIC前身\n- 80/20 → 管理层质量责任制\n\n## ⚠️ 常见误读 / 溯源提示\n- 朱兰与戴明观点相左处：戴明反对目标管理（数字目标腐蚀质量），朱兰不反对量化目标，引用时需注意二人谱系差异\n\n## 关联\n- [[戴明]]\n- [[帕累托]]\n- [[六西格玛]]\n\n---\n📚 溯源：《质量控制手册》（Quality Control Handbook, 1951初版，多版修订）；《朱兰自传》（2004） ｜ 权威等级：一手资料（原典）\n"}, {"n": "麦格雷戈", "cn": false, "t": "近代·1906—1964", "sch": "X-Y理论", "lv": "L1", "brief": "人性假设决定制度形态", "y": 1906, "body": "---\n姓名: 麦格雷戈\n国别: 外国\n时代: 行为科学\n生卒/年代: 1906—1964\n思想流派: X-Y理论\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《企业的人性面》（The Human Side of Enterprise, 1960）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 麦格雷戈\n\n> **一句话定位**：用理论X/理论Y两个极端假设照出所有管理制度背后的人性哲学。\n\n## 核心管理思想\n- 理论X：人天生厌恶工作、必须被强制控制；理论Y：工作与游戏一样自然，人寻求责任、自我指挥\n- 管理行为是管理哲学的函数：你假设人是什么，制度就把人塑造成什么（自我实现预言）\n- 整合原则：创造Y型环境使个人目标与组织目标融合\n- 权力—服从的旧管理 vs 支持—成长的新管理\n\n## 代表著作 / 一手资料\n- 《企业的人性面》（1960）\n\n## 与现代管理的映射\n- XY假设 → 管控型 vs 赋能型组织\n- 自我实现预言 → 心理契约与领导期望效应\n\n## ⚠️ 常见误读 / 溯源提示\n- “X坏Y好”的二分是简化：麦格雷戈本意是Y假设需要更多管理条件（信任、信息共享），且他本人后来参与发明Z理论探讨美日混合模式\n\n## 关联\n- [[马斯洛]]\n- [[威廉·大内]]\n- [[荀子]]\n\n---\n📚 溯源：《企业的人性面》（The Human Side of Enterprise, 1960） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "马斯洛", "cn": false, "t": "近代·1908—1970", "sch": "人本主义", "lv": "L1", "brief": "需求层次理论（《人类激励理论》1943）", "y": 1908, "body": "---\n姓名: 马斯洛\n国别: 外国\n时代: 行为科学\n生卒/年代: 1908—1970\n思想流派: 人本主义·需求层次\n资料权威等级: 一手资料（原典+晚年修正）\n一手资料来源: 《人类动机理论》（A Theory of Human Motivation, 1943, Psychological Review）；《动机与人格》（1954/1970修订）；《人性能达到的境界》（1971）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 马斯洛\n\n> **一句话定位**：需求层次理论之父，人本主义心理学旗手，把“自我实现”引入组织激励。\n\n## 核心管理思想\n- 需求五层次：生理→安全→归属与爱→尊重→自我实现（晚年扩展为八层：增加求知与审美）\n- 基本需要（缺失性）与成长需要：二者动机机制不同\n- 优势需要法则：已满足的需要不再具有激励作用——激励要瞄准“正在饿”的需要\n- 自我实现者特征：接纳现实、创造力、高峰体验\n- 晚年：健康的人超越匮乏动机，以服务他人为志\n\n## 代表著作 / 一手资料\n- 1943年论文《人类动机理论》；《动机与人格》（1954）；《人性能达到的境界》（1971）\n\n## 与现代管理的映射\n- 需求层次 → 薪酬福利与职业阶梯设计\n- 自我实现 → 使命驱动型组织与内在激励\n\n## ⚠️ 常见误读 / 溯源提示\n- ①“五层阶梯必须逐级满足”是教科书简化：马斯洛本人承认多种需要可同时作用，且顺序存在个体差异；②“需求金字塔”图形并非马斯洛所画（1960年代管理学教材附会），原论文是层级列表而非金字塔\n\n## 关联\n- [[赫茨伯格]]\n- [[麦格雷戈]]\n- [[苏东水]]\n\n---\n📚 溯源：《人类动机理论》（A Theory of Human Motivation, 1943, Psychological Review）；《动机与人格》（1954/1970修订）；《人性能达到的境界》（1971） ｜ 权威等级：一手资料（原典+晚年修正）\n"}, {"n": "新乡重夫", "cn": false, "t": "近代·1909—1990", "sch": "工业工程", "lv": "L1", "brief": "防错法+SMED 快速换模", "y": 1909, "body": "---\n姓名: 新乡重夫\n国别: 外国\n时代: 精益生产\n生卒/年代: 1909—1990\n思想流派: 工业工程·防错\n资料权威等级: 一手资料（原典）\n一手资料来源: 《作业研究入门》（Introduction to Work Study, 1957）；《零质量控制》（Zero Quality Control, 1985）\ntags: [管理思想, 外国, 现代, 精益生产]\n---\n# 新乡重夫\n\n> **一句话定位**：“防错法”（Poka-Yoke）之父，快速换模（SMED）的命名者，丰田生产方式的“外部大脑”。\n\n## 核心管理思想\n- 防错法：用装置或程序让错误不可能发生或立即显现——质量不靠检验而靠预防\n- SMED：把换模分为内外作业，内改外——换模时间数量级压缩\n- 源头检查（Source Inspection）：缺陷在产生点被捕捉，而非流出到下游\n- 工业工程方法：动素研究与流程图的标准化（《作业研究入门》为IE经典教材）\n\n## 代表著作 / 一手资料\n- 《作业研究入门》（1957/1982修订）；《零质量控制》（1985）\n\n## 与现代管理的映射\n- Poka-Yoke → 防错设计与人因工程\n- SMED → 柔性制造与小批量\n\n## ⚠️ 常见误读 / 溯源提示\n- 其贡献长期被置于丰田光环之下，实际防错与SMED均为其独立创造，引用应注明其著作而非笼统归于“丰田模式”\n\n## 关联\n- [[大野耐一]]\n- [[吉尔布雷斯夫妇]]\n- [[戴明]]\n\n---\n📚 溯源：《作业研究入门》（Introduction to Work Study, 1957）；《零质量控制》（Zero Quality Control, 1985） ｜ 权威等级：一手资料（原典）\n"}, {"n": "孔茨", "cn": false, "t": "近代·1909—1991", "sch": "管理过程学派", "lv": "L1", "brief": "计划-组织-领导-控制四职能框架与POSDCORB", "y": 1909, "body": "---\ntags: [存目]\n---\n# 孔茨\n\n管理过程学派集大成者：《管理学》教科书框架（计划组织领导控制人事）的确立者，'管理理论丛林'一词提出者。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "德鲁克", "cn": false, "t": "近代·1909—2005", "sch": "经验主义", "lv": "L1", "brief": "MBO+知识工作者+有组织创新", "y": 1909, "body": "---\n姓名: 德鲁克\n国别: 外国\n时代: 现代管理\n生卒/年代: 1909—2005\n思想流派: 经验主义学派\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 《管理的实践》（The Practice of Management, 1954）；《卓有成效的管理者》（1966）；《管理：任务、责任、实践》（1973）；《创新与企业家精神》（1985）；《21世纪的管理挑战》（1999）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 德鲁克\n\n> **一句话定位**：“现代管理学之父”，目标管理之父，把知识工作者与创新定为21世纪管理的核心命题。\n\n## 核心管理思想\n- 目标管理（MBO）：目标自上而下分解、自我控制——发挥个人长处与责任感\n- 管理三大任务：实现组织特定目的、使工作有成效并让员工有成就感、处理社会影响与社会责任\n- 知识工作者：生产率不在于数量而在于质量与方向——对体力工人管理逻辑的整体颠覆\n- 创新与企业家精神：创新是有目的的活动，可被组织化、系统化（有组织的放弃、七大创新机会源）\n- 卓有成效五项修炼：时间管理、着眼于贡献、发挥长处、要事优先、有效决策\n- 分权与联邦分权制；1988年预言“中层管理的黄昏”——组织扁平化的先声\n\n## 代表著作 / 一手资料\n- 《管理的实践》（1954）；《卓有成效的管理者》（1966）；《管理：任务、责任、实践》（1973）；《创新与企业家精神》（1985）\n\n## 与现代管理的映射\n- MBO → OKR与战略解码\n- 知识工作者 → 数字化时代人才管理\n- 有组织创新 → 创新管理体系\n\n## ⚠️ 常见误读 / 溯源提示\n- ①“德鲁克发明了管理学”言过其实（同时代有法约尔、巴纳德），他做的是把管理整合为独立的实践学科；②其目标管理在日本经戴明质量管理折返后演变为方针管理，与美式MBO有别，引用时应注意两条谱系\n\n## 关联\n- [[斯隆]]\n- [[马奇]]\n- [[丰田生产方式]]\n- [[任正非]]\n\n---\n📚 溯源：《管理的实践》（The Practice of Management, 1954）；《卓有成效的管理者》（1966）；《管理：任务、责任、实践》（1973）；《创新与企业家精神》（1985）；《21世纪的管理挑战》（1999） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "默顿", "cn": false, "t": "近代·1910—2003", "sch": "社会学", "lv": "L1", "brief": "目标置换：科层制的解毒剂", "y": 1910, "body": "---\n姓名: 默顿\n国别: 外国\n时代: 社会学\n生卒/年代: 1910—2003\n思想流派: 科层制功能失调研究\n资料权威等级: 一手资料（原典）\n一手资料来源: 《科层结构与人格》（Bureaucratic Structure and Personality, Social Forces, 1940）；《社会理论与社会结构》（1949/1968修订）\ntags: [管理思想, 外国, 现代, 科层制]\n---\n# 默顿\n\n> **一句话定位**：给韦伯科层制装上解毒剂的社会学家，目标置换（Goal Displacement）概念的提出者。\n\n## 核心管理思想\n- 科层制功能失调：层级服从可能压倒组织目标，手段变目的（目标置换）\n- 训练有素的无能：越专业越难看到整体——专家困境\n- 结构性约束：非预期后果（unintended consequences）——设计必留冗余与反馈\n\n## 代表著作 / 一手资料\n- 1940年《科层结构与人格》；《社会理论与社会结构》（1949/1968）\n\n## 与现代管理的映射\n- 目标置换 → KPI异化与古德哈特定律（指标成目标即失效）\n- 非预期后果 → 制度设计压力测试\n\n## ⚠️ 常见误读 / 溯源提示\n- “科层制=低效率”不是默顿结论：他分析的是理性设计的非预期副作用，目的在完善而非推翻科层制\n\n## 关联\n- [[马克斯·韦伯]]\n- [[西蒙]]\n- [[组织]]\n\n---\n📚 溯源：《科层结构与人格》（Bureaucratic Structure and Personality, Social Forces, 1940）；《社会理论与社会结构》（1949/1968修订） ｜ 权威等级：一手资料（原典）\n"}, {"n": "科斯", "cn": false, "t": "近代·1910—2013", "sch": "制度经济", "lv": "L1", "brief": "交易成本与企业的边界：《企业、市场与法律》1937", "y": 1910, "body": "---\n姓名: 科斯\n国别: 外国\n时代: 制度经济学\n生卒/年代: 1910—2013\n思想流派: 交易成本经济学\n资料权威等级: 一手资料（原典传世，1991年诺贝尔经济学奖）\n一手资料来源: 《企业的性质》（The Nature of the Firm, Economica, 1937）；《社会成本问题》（The Problem of Social Cost, 1960）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 科斯\n\n> **一句话定位**：用交易成本回答“企业为什么会存在”——新制度经济学的起点。\n\n## 核心管理思想\n- 企业的性质：市场有交易成本（搜寻、谈判、签约、监督），企业以行政命令取代市场契约而节约之——企业的边界=交易成本等于组织成本的点\n- 产权理论与社会成本：产权界定清晰时，谈判可使外部性内部化（科斯定理）\n- 制度的选择标准：制度运行的交易成本（其后期对中国经济改革的考察也循此逻辑）\n\n## 代表著作 / 一手资料\n- 1937年《企业的性质》；1960年《社会成本问题》\n\n## 与现代管理的映射\n- 交易成本 → 外包/自制决策与组织边界设计\n- 科斯定理 → 平台治理与产权设计\n\n## ⚠️ 常见误读 / 溯源提示\n- 科斯定理的零交易成本世界是思想实验条件，科斯本人反对将其作为现实政策基础；引用必须强调正交易成本才是科斯的现实关切\n\n## 关联\n- [[威廉姆森]]\n- [[钱德勒]]\n- [[张五常]]\n\n---\n📚 溯源：《企业的性质》（The Nature of the Firm, Economica, 1937）；《社会成本问题》（The Problem of Social Cost, 1960） ｜ 权威等级：一手资料（原典传世，1991年诺贝尔经济学奖）\n"}, {"n": "大野耐一", "cn": false, "t": "近代·1912—1990", "sch": "精益生产", "lv": "L2", "brief": "JIT+自働化+七大浪费", "y": 1912, "body": "---\n姓名: 大野耐一\n国别: 外国\n时代: 精益生产\n生卒/年代: 1912—1990\n思想流派: 丰田生产方式TPS\n资料权威等级: 一手资料（著作+口述，丰田内部文献）\n一手资料来源: 《丰田生产方式》（1978日文原版）；口述整理《现场管理》（Workplace Management, 1982）；新乡重夫《丰田生产系统》（1988英文版）\ntags: [管理思想, 外国, 现代, 精益生产]\n---\n# 大野耐一\n\n> **一句话定位**：“生产管理教父”，丰田生产方式的缔造者，准时化与自働化的活水源。\n\n## 核心管理思想\n- 两大支柱：准时化（JIT，必要时刻生产必要数量）+ 自働化（机器带人字旁=自动停线，质量内建）\n- 七大浪费：过量生产、等待、搬运、过度加工、库存、动作、不良品\n- 看板：拉动式生产的信号系统——后工序取货，前工序只补充被取走的量\n- 快速换模（SMED，与新乡重夫合作）：把冲压换模从数小时压到分钟级——小批量经济性的关键\n- 现地现物（Gemba）：去现场，看实物，基于事实管理\n\n## 代表著作 / 一手资料\n- 《丰田生产方式》（1978）；《现场管理》（1982口述）\n\n## 与现代管理的映射\n- JIT与看板 → 精益与敏捷软件\n- 七大浪费 → 流程诊断清单\n- 现地现物 → MBWA走动式管理\n\n## ⚠️ 常见误读 / 溯源提示\n- ①TPS是丰田数十年现场试错演化的活体系统，读其著作易得其形（工具）而失其神（人）；②大野耐一著作是晚年口述整理，系统理解应配合新乡重夫与新井贞文等的研究文献\n\n## 关联\n- [[戴明]]\n- [[朱兰]]\n- [[哈默]]\n- [[孙武（孙子）]]\n\n---\n📚 溯源：《丰田生产方式》（1978日文原版）；口述整理《现场管理》（Workplace Management, 1982）；新乡重夫《丰田生产系统》（1988英文版） ｜ 权威等级：一手资料（著作+口述，丰田内部文献）\n"}, {"n": "西蒙", "cn": false, "t": "近代·1916—2001", "sch": "决策理论", "lv": "L1", "brief": "有限理性与满意原则", "y": 1916, "body": "---\n姓名: 西蒙\n国别: 外国\n时代: 决策学派\n生卒/年代: 1916—2001\n思想流派: 决策理论学派\n资料权威等级: 一手资料（原典传世，1978年诺贝尔经济学奖）\n一手资料来源: 《管理行为》（Administrative Behavior, 1947/第4版1997）；与马奇合著《组织》（Organizations, 1958）；《理性选择的行为模型》（1955）\ntags: [管理思想, 外国, 现代, 决策理论]\n---\n# 西蒙\n\n> **一句话定位**：“决策是管理的心脏”，有限理性与满意原则，1978年诺贝尔经济学奖得主。\n\n## 核心管理思想\n- 管理即决策：决策贯穿计划、组织、领导、控制全部职能\n- 有限理性（Bounded Rationality）：人受认知与信息限制，只能满意而非最优\n- 程序化与非程序化决策：例行问题交给规则与惯例，例外问题交给判断与创新\n- 决策四阶段：情报（搜集信息）—设计（拟定方案）—抉择—审查\n- 诱因—贡献理论（与马奇）：组织存续取决于参与者诱因与贡献的平衡——继承巴纳德\n\n## 代表著作 / 一手资料\n- 《管理行为》（1947）；《组织》（1958，与马奇合著）；《人工科学》（1969）\n\n## 与现代管理的映射\n- 有限理性 → 启发式决策与行为经济学\n- 程序化决策 → SOP与例外管理授权\n\n## ⚠️ 常见误读 / 溯源提示\n- “满意原则”不是退而求其次的消极妥协，而是对现实认知约束的理性回应；其决策概念涵盖设计备选方案全过程，远大于日常说的“拍板”\n\n## 关联\n- [[切斯特·巴纳德]]\n- [[马奇]]\n- [[卡尼曼]]\n- [[决策]]\n\n---\n📚 溯源：《管理行为》（Administrative Behavior, 1947/第4版1997）；与马奇合著《组织》（Organizations, 1958）；《理性选择的行为模型》（1955） ｜ 权威等级：一手资料（原典传世，1978年诺贝尔经济学奖）\n"}, {"n": "安索夫", "cn": false, "t": "近代·1918—2002", "sch": "战略规划", "lv": "L1", "brief": "安索夫矩阵+战略协同：《从战略到组织》1965", "y": 1918, "body": "---\n姓名: 安索夫\n国别: 外国\n时代: 战略管理\n生卒/年代: 1918—2002\n思想流派: 战略规划学派\n资料权威等级: 一手资料（原典）\n一手资料来源: 《公司战略》（Corporate Strategy, 1965）；《战略管理》（1979）；《新公司战略》（1988修订）\ntags: [管理思想, 外国, 现代, 规划学派]\n---\n# 安索夫\n\n> **一句话定位**：“战略管理之父”，把战略一词带入企业语境，安索夫矩阵的作者。\n\n## 核心管理思想\n- 战略决策四要素：产品与市场领域、成长向量、竞争优势、协同效应（1+1>2）\n- 安索夫矩阵：市场渗透、市场开发、产品开发、多元化——四种成长路径风险递进\n- 战略与计划的关系：环境动荡分级，动荡环境需要主动寻求新机会的战略行为\n- 战略问题管理（SIM）：早期预警与议题管理\n\n## 代表著作 / 一手资料\n- 《公司战略》（1965）；《战略管理》（1979）；《新公司战略》（1988）\n\n## 与现代管理的映射\n- 安索夫矩阵 → 增长战略工具箱\n- 协同 → 多元化并购的核心检验标准\n\n## ⚠️ 常见误读 / 溯源提示\n- 其战略计划思想后来被明茨伯格批评为规划崇拜，但安索夫本人后期也转向战略问题管理与环境适应，引用应区分其1965年原典与后期修正\n\n## 关联\n- [[明茨伯格]]\n- [[迈克尔·波特]]\n- [[战略规划]]\n\n---\n📚 溯源：《公司战略》（Corporate Strategy, 1965）；《战略管理》（1979）；《新公司战略》（1988修订） ｜ 权威等级：一手资料（原典）\n"}, {"n": "钱德勒", "cn": false, "t": "近代·1918—2007", "sch": "企业史", "lv": "L1", "brief": "战略决定结构：《战略与结构》1962", "y": 1918, "body": "---\n姓名: 钱德勒\n国别: 外国\n时代: 战略管理\n生卒/年代: 1918—2007\n思想流派: 战略—结构·企业史\n资料权威等级: 一手资料（原典，企业史经典）\n一手资料来源: 《战略与结构》（Strategy and Structure, 1962）；《看得见的手》（The Visible Hand, 1977，普利策奖）；《规模与范围》（Scale and Scope, 1990）\ntags: [管理思想, 外国, 现代, 规划学派]\n---\n# 钱德勒\n\n> **一句话定位**：“战略决定结构，结构跟随战略”——用杜邦、通用、新泽西标准石油百年档案得出的铁律。\n\n## 核心管理思想\n- 战略—结构命题：多元化战略必须先于事业部制组织变革（否则多元化失败）\n- 看得见的手：现代多单位企业以管理协调取代市场协调——交易成本思想的实证前奏\n- 规模经济与范围经济：组织能力构筑进入壁垒的历史机制\n- 管理革命：所有权与控制权分离、职业经理层兴起\n\n## 代表著作 / 一手资料\n- 《战略与结构》（1962）；《看得见的手》（1977）；《规模与范围》（1990）\n\n## 与现代管理的映射\n- 战略—结构 → 组织变革与集团管控\n- 看得见的手 → 科斯-威廉姆森交易成本的实证基础\n\n## ⚠️ 常见误读 / 溯源提示\n- “结构跟随战略”被当成单向铁律：后续研究证明结构也反作用于战略（战略结构互适），且其样本为美国大型工业企业，迁移需情境化\n\n## 关联\n- [[科斯]]\n- [[钱德勒]]\n- [[事业部制]]\n\n---\n📚 溯源：《战略与结构》（Strategy and Structure, 1962）；《看得见的手》（The Visible Hand, 1977，普利策奖）；《规模与范围》（Scale and Scope, 1990） ｜ 权威等级：一手资料（原典，企业史经典）\n"}, {"n": "马奇", "cn": false, "t": "近代·1926—2018", "sch": "决策·组织学习", "lv": "L1", "brief": "探索/利用与垃圾桶模型：《决策的选项》1972", "y": 1926, "body": "---\n姓名: 马奇\n国别: 外国\n时代: 决策学派\n生卒/年代: 1926—2018\n思想流派: 决策理论·组织学习\n资料权威等级: 一手资料（原典传世）\n一手资料来源: 与西蒙《组织》（Organizations, 1958）；《组织学习中的探索与利用》（Exploration and Exploitation in Organizational Learning, 1991）\ntags: [管理思想, 外国, 现代, 决策理论]\n---\n# 马奇\n\n> **一句话定位**：西蒙的最佳搭档，“探索—利用”、垃圾桶模型与组织学习的理论建筑师。\n\n## 核心管理思想\n- 探索与利用：组织在开发已有能力与探索新可能之间的永恒张力——创新管理的元问题\n- 垃圾桶决策模型（与科恩、奥尔森）：问题、解决方案、参与者、选择机会四流随机相遇——组织选择常是非理性偶合\n- 组织学习的两难：学习要利用旧知识，创新要探索新知识，资源分配天然偏向利用\n- 愚蠢与智慧：组织需要保留相当的愚蠢——行为多样性的价值\n\n## 代表著作 / 一手资料\n- 《组织》（1958，与西蒙合著）；1991年论文《组织学习中的探索与利用》\n\n## 与现代管理的映射\n- 探索/利用 → 第二曲线与创新组合管理\n- 垃圾桶模型 → 理解政策与组织决策的现实\n\n## ⚠️ 常见误读 / 溯源提示\n- 垃圾桶模型常被当作讽刺，实为严肃的组织决策过程模型，解释了为什么好方案常遇不到合适的问题\n\n## 关联\n- [[西蒙]]\n- [[圣吉]]\n- [[创新管理]]\n\n---\n📚 溯源：与西蒙《组织》（Organizations, 1958）；《组织学习中的探索与利用》（Exploration and Exploitation in Organizational Learning, 1991） ｜ 权威等级：一手资料（原典传世）\n"}, {"n": "劳伦斯与洛希", "cn": false, "t": "近代·1922—2003 / 1930—2011", "sch": "权变组织理论", "lv": "L1", "brief": "无权变就无管理：以F因子解释组织结构差异", "y": 1922, "body": "---\ntags: [存目]\n---\n# 劳伦斯与洛希\n\n权变组织理论：差异化与整合性的匹配（《组织与环境》1967）。关联：[[卡斯特与罗森茨韦克]] [[菲德勒]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "菲德勒", "cn": false, "t": "近代·1922—2017", "sch": "权变领导", "lv": "L3", "brief": "LPC量表与领导效能三维：让工作适应管理者（LPC量表效度与复制问题）", "y": 1922, "body": "---\n姓名: 菲德勒\n国别: 外国\n时代: 权变理论\n生卒/年代: 1922—2017\n思想流派: 权变领导理论\n资料权威等级: 一手资料（原典）\n一手资料来源: 《领导效能理论》（A Theory of Leadership Effectiveness, 1967）；HBR《改造工作以适合管理者》（1965）\ntags: [管理思想, 外国, 现代, 权变理论]\n---\n# 菲德勒\n\n> **一句话定位**：领导权变理论旗手：让工作适应管理者，而非强求管理者适应工作。\n\n## 核心管理思想\n- LPC量表：用最不愿共事者打分测领导风格（任务导向 vs 关系导向）\n- 情境三要素：领导者—成员关系、任务结构、职位权力——决定情境有利度\n- 匹配原则：任务导向在有利与极不利情境更有效，关系导向居中情境更有效——风格不可改造，情境可改造\n- 以工作就人：通过改变情境变量（重新分配任务、调整职位权力）实现人岗匹配\n\n## 代表著作 / 一手资料\n- 《领导效能理论》（1967）；HBR 1965《改造工作以适合管理者》\n\n## 与现代管理的映射\n- 情境匹配 → 高管任命与团队配置\n- 情境改造 → 工作设计与授权边界\n\n## ⚠️ 常见误读 / 溯源提示\n- “领导风格终身不变”是其有争议的硬核假设，后被赫塞—布兰查德情境理论部分修正；引用其结论需说明LPC量表的效度争议\n\n## 关联\n- [[赫塞与布兰查德]]\n- [[豪斯]]\n- [[流派-权变理论]]\n\n---\n📚 溯源：《领导效能理论》（A Theory of Leadership Effectiveness, 1967）；HBR《改造工作以适合管理者》（1965） ｜ 权威等级：一手资料（原典）\n"}, {"n": "赫茨伯格", "cn": false, "t": "近代·1923—2000", "sch": "双因素", "lv": "L3", "brief": "保健/激励二分+工作丰富化（双因子研究样本与效度受质疑）", "y": 1923, "body": "---\n姓名: 赫茨伯格\n国别: 外国\n时代: 行为科学\n生卒/年代: 1923—2000\n思想流派: 双因素理论\n资料权威等级: 一手资料（原典+方法论争议）\n一手资料来源: 《工作与人的本性》（Work and the Nature of Man, 1966）；HBR《再问一次：你如何激励员工？》（One More Time, 1968）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 赫茨伯格\n\n> **一句话定位**：用关键事件访谈把马斯洛的需要切成保健与激励两半，重塑全球薪酬管理。\n\n## 核心管理思想\n- 双因素：保健因素（公司政策、工资、工作条件、人际关系——缺失导致不满）与激励因素（成就、认可、工作本身、责任、晋升——带来满意）\n- 满意的对立面不是不满意而是“没有满意”：两种因素作用于不同维度\n- 工作丰富化（Job Enrichment）：纵向扩展工作内容，给员工完整的责任单元，而非横向加码（工作扩大化）\n- KITA批判：外在奖惩是“擦伤”而非激励——负激励的局限\n\n## 代表著作 / 一手资料\n- 《工作与人的本性》（1966）；HBR 1968《再问一次：你如何激励员工？》\n\n## 与现代管理的映射\n- 双因素 → 薪酬定位策略（保健对外公平、激励对内激活）\n- 工作丰富化 → 岗位设计与敏捷团队\n\n## ⚠️ 常见误读 / 溯源提示\n- ①其方法（关键事件法、样本限于工程师与会计师）受方法论批评，双因素的普适性存疑；②“保健因素不重要”是误读——保健是地基，但仅堆保健无法产出满意与绩效\n\n## 关联\n- [[马斯洛]]\n- [[弗雷德里克·泰勒]]\n- [[工作设计]]\n\n---\n📚 溯源：《工作与人的本性》（Work and the Nature of Man, 1966）；HBR《再问一次：你如何激励员工？》（One More Time, 1968） ｜ 权威等级：一手资料（原典+方法论争议）\n"}, {"n": "克劳斯比", "cn": false, "t": "近代·1926—2001", "sch": "零缺陷", "lv": "L2", "brief": "质量无缺陷与\"质量免费\"", "y": 1926, "body": "---\n姓名: 克劳斯比\n国别: 外国\n时代: 质量管理\n生卒/年代: 1926—2001\n思想流派: 零缺陷\n资料权威等级: 一手资料（原典）\n一手资料来源: 《质量免费》（Quality is Free, 1979）；《质量无泪》（Quality Without Tears, 1984）\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 克劳斯比\n\n> **一句话定位**：“零缺陷”与“质量免费”口号的提出者，质量成本的普及者。\n\n## 核心管理思想\n- 零缺陷（Zero Defects）：第一次就把事情做对——工作标准哲学\n- 质量免费：质量成本（预防+评估+内外部失败）远低于失败成本，做好质量反而省钱\n- 四项absolutes：质量=符合要求、系统=预防、绩效标准=零缺陷、衡量=质量成本\n\n## 代表著作 / 一手资料\n- 《质量免费》（1979）；《质量无泪》（1984）\n\n## 与现代管理的映射\n- 零缺陷 → 全检文化与防错设计（Poka-Yoke）\n- 质量成本 → CFO视角的质量投资论证\n\n## ⚠️ 常见误读 / 溯源提示\n- “零缺陷”口号在软件等探索性领域遭反对（温伯格等），其语境是制造与事务性流程，引用需限定适用边界\n\n## 关联\n- [[戴明]]\n- [[朱兰]]\n- [[大野耐一]]\n\n---\n📚 溯源：《质量免费》（Quality is Free, 1979）；《质量无泪》（Quality Without Tears, 1984） ｜ 权威等级：一手资料（原典）\n"}, {"n": "安德鲁斯", "cn": false, "t": "近代·1926—2005", "sch": "战略规划", "lv": "L1", "brief": "SWOT分析定型（《公司战略》1965，为哈佛商学院案例法定型）", "y": 1926, "body": "---\ntags: [存目]\n---\n# 安德鲁斯\n\n哈佛设计学派：SWOT 框架（优势/劣势/机会/威胁四要素）的教学化定型者。见 [[理论-SWOT分析]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "伯法", "cn": false, "t": "近代·1926—2005", "sch": "管理科学学派", "lv": "L1", "brief": "运筹学与系统分析引入管理决策：《科学管理》1955", "y": 1926, "body": "---\n姓名: 伯法\n国别: 外国\n时代: 管理科学\n生卒/年代: 1926—2005\n思想流派: 管理科学学派\n资料权威等级: 一手资料（原典）\n一手资料来源: 《现代生产管理》（Modern Production Management, 1961）；《生产管理基础》（Fundamentals of Production Management）\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 伯法\n\n> **一句话定位**：管理科学（数量管理）学派代表，把运筹学方法系统引入生产管理教学。\n\n## 核心管理思想\n- 用数学模型与运筹学（线性规划、排队论、库存模型、决策树）解决管理问题\n- 视组织为经济—技术系统，效率可由量化优化达成\n- 模型是辅助而非替代判断——其本人也承认模型依赖的前提条件在现实组织中的脆弱性\n\n## 代表著作 / 一手资料\n- 《现代生产管理》（1961）；《生产管理基础》\n\n## 与现代管理的映射\n- 定量方法 → 供应链优化与数据科学的前身\n- 模型思维 → 管理决策支持系统\n\n## ⚠️ 常见误读 / 溯源提示\n- 管理科学学派1960-70年代盛极一时后式微，常被AI时代重新发现叙事夸大；其与行为科学的张力（量化vs定性）至今仍在，引用应置于该辩论语境\n\n## 关联\n- [[西蒙]]\n- [[弗雷德里克·泰勒]]\n- [[数据管理]]\n\n---\n📚 溯源：《现代生产管理》（Modern Production Management, 1961）；《生产管理基础》（Fundamentals of Production Management） ｜ 权威等级：一手资料（原典）\n"}, {"n": "霍夫斯泰德", "cn": false, "t": "近代·1928—2020", "sch": "跨文化管理", "lv": "L3", "brief": "六文化维度（数据仅来自IBM单一公司样本）", "y": 1928, "body": "---\n姓名: 霍夫斯泰德\n国别: 外国\n时代: 跨文化管理\n生卒/年代: 1928—2020\n思想流派: 跨文化比较\n资料权威等级: 一手资料（原典+方法论争议）\n一手资料来源: 《文化的影响》（Culture's Consequences, 1980/2001修订）；《文化与组织：心智的软件》（Cultures and Organizations, 1991）；IBM调查数据库\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 霍夫斯泰德\n\n> **一句话定位**：用IBM跨国员工问卷把文化量化成六个维度，跨文化管理的开创者。\n\n## 核心管理思想\n- 六文化维度：权力距离、个人主义/集体主义、男性化/女性化、不确定性规避、长期导向、放任/克制\n- 管理实践的文化相对性：美国管理概念（如MBO）在非美国情境会系统性失灵——管理理论是文化的孩子\n- 洋葱模型：价值观、仪式、英雄、符号四圈层\n\n## 代表著作 / 一手资料\n- 《文化的影响》（1980/2001）；《文化与组织：心智的软件》（1991）\n\n## 与现代管理的映射\n- 权力距离 → 授权设计与汇报文化\n- 长期导向 → 战略耐心与研发投资\n\n## ⚠️ 常见误读 / 溯源提示\n- ①其数据来自单一公司（IBM）单一时间点（1967-1973），生态效度受质疑；②六维度模型被企业用作国家人格刻板印象，霍夫斯泰德本人反对将维度分数用于个体预测\n\n## 关联\n- [[沙因]]\n- [[威廉·大内]]\n- [[跨文化管理]]\n\n---\n📚 溯源：《文化的影响》（Culture's Consequences, 1980/2001修订）；《文化与组织：心智的软件》（Cultures and Organizations, 1991）；IBM调查数据库 ｜ 权威等级：一手资料（原典+方法论争议）\n"}, {"n": "沙因", "cn": false, "t": "近代·1928—2023", "sch": "组织文化", "lv": "L1", "brief": "组织文化三层次+职业锚", "y": 1928, "body": "---\n姓名: 沙因\n国别: 外国\n时代: 组织文化\n生卒/年代: 1928—2023\n思想流派: 组织文化·过程咨询\n资料权威等级: 一手资料（原典）\n一手资料来源: 《组织文化与领导力》（Organizational Culture and Leadership, 1985/多版修订）；《职业锚》（Career Dynamics, 1978）；《过程咨询》（Process Consultation, 1969）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 沙因\n\n> **一句话定位**：组织文化三层次模型（人工制品—价值观—基本假设）的作者，MIT斯隆学院的精神教父。\n\n## 核心管理思想\n- 文化三层次：外显人工制品、信奉价值观、基本深层假设——只有第三层才是文化的真身\n- 职业锚：技术、管理、自主、安全、创业等自我认知决定职业路径\n- 过程咨询：顾问帮助客户学会自己诊断，而非给现成答案\n- 文化演进观：文化是组织在解决外部适应与内部整合问题中习得的集体认知\n\n## 代表著作 / 一手资料\n- 《组织文化与领导力》（1985）；《职业锚》（1978）；《过程咨询》（1969）\n\n## 与现代管理的映射\n- 三层次模型 → 企业文化诊断与价值观落地\n- 职业锚 → 员工发展与继任计划\n\n## ⚠️ 常见误读 / 溯源提示\n- 文化三层次被简化成“物质-制度-精神”三分法，丢失了“基本假设是无意识”这一关键——真正的文化冲突发生在假设层\n\n## 关联\n- [[霍夫斯泰德]]\n- [[理论-组织文化三层次]]\n- [[切斯特·巴纳德]]\n\n---\n📚 溯源：《组织文化与领导力》（Organizational Culture and Leadership, 1985/多版修订）；《职业锚》（Career Dynamics, 1978）；《过程咨询》（Process Consultation, 1969） ｜ 权威等级：一手资料（原典）\n"}, {"n": "卡斯特与罗森茨韦克", "cn": false, "t": "近代·1930— / 1932—2014", "sch": "系统管理学派", "lv": "L1", "brief": "开放系统模型与七变量子系统结构：《组织管理：系统方法》", "y": 1930, "body": "---\n姓名: 卡斯特与罗森茨韦克\n国别: 外国\n时代: 系统学派\n生卒/年代: 1930— / 1932—2014\n思想流派: 系统管理学派\n资料权威等级: 一手资料（原典）\n一手资料来源: 《组织与管理：系统方法与权变方法》（Organization and Management: A Systems and Contingency Approach, 1970/1979修订）\ntags: [管理思想, 外国, 现代, 系统学派]\n---\n# 卡斯特与罗森茨韦克\n\n> **一句话定位**：把一般系统论（贝塔朗菲）完整移植进管理学的教科书级作者。\n\n## 核心管理思想\n- 组织是开放的系统：投入—转换—产出，与环境持续交换物质、能量、信息\n- 系统五子系统：目标与价值、技术、结构、社会心理、管理——任何组织变革须五者协同\n- 权变观：如果—那么情境函数，不存在最优组织形式\n- 差异性与整合性：劳伦斯与洛希的补充——组织各部门既要专业化又要整合\n\n## 代表著作 / 一手资料\n- 《组织与管理：系统方法与权变方法》（1970/1979）\n\n## 与现代管理的映射\n- 开放系统 → 生态型组织与平台战略\n- 五子系统 → 组织诊断框架\n\n## ⚠️ 常见误读 / 溯源提示\n- 系统管理学派常被批评为概念宏大而操作指针不足，引用时宜作为世界观框架而非具体工具\n\n## 关联\n- [[流派-系统学派]]\n- [[贝塔朗菲]]\n- [[菲德勒]]\n\n---\n📚 溯源：《组织与管理：系统方法与权变方法》（Organization and Management: A Systems and Contingency Approach, 1970/1979修订） ｜ 权威等级：一手资料（原典）\n"}, {"n": "科特勒", "cn": false, "t": "近代·1931—", "sch": "营销管理", "lv": "L1", "brief": "STP+4P+生命周期：《营销管理》1988首版", "y": 1931, "body": "---\ntags: [存目]\n---\n# 科特勒\n\n相关主题存目页，待展开成完整卡片。\n\n> ⚑ 存目桩页：为保持图谱连通而设，待展开。"}, {"n": "赫塞与布兰查德", "cn": false, "t": "近代·1931— / 1939—2012", "sch": "情境领导", "lv": "L1", "brief": "领导风格随下属成熟度调整（D1–D4 象限）", "y": 1931, "body": "---\n姓名: 赫塞与布兰查德\n国别: 外国\n时代: 权变理论\n生卒/年代: 1931— / 1939—2012\n思想流派: 情境领导理论\n资料权威等级: 一手资料（原典+商业化争议）\n一手资料来源: 赫塞与布兰查德《组织行为学：管理人力资源》（Management of Organizational Behavior, 1969初版，多版修订）\ntags: [管理思想, 外国, 现代, 权变理论]\n---\n# 赫塞与布兰查德\n\n> **一句话定位**：把领导风格折叠成告知—推销—参与—授权四象限，随下属成熟度换挡。\n\n## 核心管理思想\n- 领导两维：任务行为与关系行为，组合成S1告知、S2推销、S3参与、S4授权\n- 下属成熟度三要素：能力与意愿（心理成熟度与工作成熟度）\n- 情境匹配矩阵：低成熟度用告知，渐升用推销、参与，高成熟度用授权\n- 追随者中心：领导有效性=风格×情境，情境的关键变量是下属而非任务\n\n## 代表著作 / 一手资料\n- 《组织行为学：管理人力资源》（1969，多版修订）\n\n## 与现代管理的映射\n- 情境领导 → 新员工带教与授权梯度\n- 成熟度诊断 → 差异化管理\n\n## ⚠️ 常见误读 / 溯源提示\n- 情境领导模型因易讲授被商业培训机构过度简化（成熟度=能力与意愿二变量被当成全部情境），学术研究对其效度证据评价一般，应定位为实用工具而非严格理论\n\n## 关联\n- [[菲德勒]]\n- [[豪斯]]\n- [[领导力]]\n\n---\n📚 溯源：赫塞与布兰查德《组织行为学：管理人力资源》（Management of Organizational Behavior, 1969初版，多版修订） ｜ 权威等级：一手资料（原典+商业化争议）\n"}, {"n": "稻盛和夫", "cn": false, "t": "近代·1932—", "sch": "阿米巴经营", "lv": "L1", "brief": "单元时间核算与\"敬天爱人\"的经营哲学", "y": 1932, "body": "---\n姓名: 稻盛和夫\n国别: 外国\n时代: 现代（日本）\n生卒/年代: 1932—2022\n思想流派: 经营哲学·阿米巴\n资料权威等级: 一手著作+二手解读泛滥\n一手资料来源: 《活法》《阿米巴经营》《经营十二条》（经日本盛和塾体系整理）；讲话录音整理本\ntags: [管理思想, 外国, 现代, 经营哲学]\n---\n# 稻盛和夫\n\n> **一句话定位**：创立两家世界500强（京瓷、KDDI）、以78岁重整日航的企业家哲学家。\n\n## 核心管理思想\n- 阿米巴经营：小集体独立核算，用'单位时间核算'衡量附加价值，追求'销售额最大化、经费最小化'\n- 经营十二条与六项精进：以'敬天爱人'为原点，把经营哲学当作第一生产力\n- 稻盛会计学'一一对应'原则与'作为人，何谓正确'的判断基准\n- 成功方程式：人生·工作结果=思维方式×热情×能力\n\n## 代表著作 / 一手资料\n- 《活法》；《阿米巴经营》；《经营十二条》；《干法》；日航重建讲话集\n\n## 与现代管理的映射\n- 阿米巴 → 内部市场化/利润中心（但稻盛版≠分成承包）\n- 经营哲学 → 使命驱动型组织（与德鲁克互相印证）\n\n## ⚠️ 常见误读 / 溯源提示\n- 最大误读：把阿米巴做成'利润分成承包制'。稻盛2010年答海尔高层时明确：阿米巴业绩只与职位升降、荣誉挂钩，不直接分钱，以金钱刺激会摧毁互帮互助。国内多数'阿米巴咨询'实为管理会计利润中心换壳（见03溯源图谱）\n\n## 关联\n- [[德鲁克]]\n- [[巴纳德]]\n- [[大野耐一]]\n- [[经验-稻盛和夫-阿米巴经营与经营哲学]]\n\n---\n📚 溯源：《活法》《阿米巴经营》《经营十二条》（经日本盛和塾体系整理）；讲话录音整理本 ｜ 权威等级：一手著作+二手解读泛滥\n"}, {"n": "查尔斯·汉迪", "cn": false, "t": "近代·1932—2024", "sch": "组织哲学", "lv": "L1", "brief": "组织文化四种类型与第五种组织：\"怪人\"共生", "y": 1932, "body": "---\n姓名: 查尔斯·汉迪\n国别: 外国\n时代: 现代（爱尔兰）\n生卒/年代: 1932—\n思想流派: 组织哲学·未来组织\n资料权威等级: 一手著作\n一手资料来源: 《管理的众神》（Gods of Management, 1978）；《非理性的时代》（The Age of Unreason, 1989）；《大象与跳蚤》（2001）；《空雨衣》（1994）\ntags: [管理思想, 外国, 现代, 组织理论]\n---\n# 查尔斯·汉迪\n\n> **一句话定位**：与德鲁克齐名的管理哲学家，提出'三叶草组织''联邦组织'' doughnut 职责圈'等未来组织概念。\n\n## 核心管理思想\n- 三叶草组织（Shamrock）：核心专业团队+外包专家+弹性人力三叶结构\n- 四种管理文化：宙斯（权力）-阿波罗（角色）-雅典娜（任务）-狄俄尼索斯（个人），对应四种组织结构\n- 甜甜圈职责圈：职位有硬核心（必须做）+软外圈（自主裁量空间）——授权的操作化\n- 第二曲线：组织须在第一条曲线到达顶点前开启第二增长曲线\n\n## 代表著作 / 一手资料\n- 《管理的众神》（1978）；《非理性的时代》（1989）；《空雨衣》（1994）；《第二曲线》（2015）\n\n## 与现代管理的映射\n- 三叶草 → 平台用工与零工经济组织形态\n- 第二曲线 → 创新组合管理（与马奇探索/利用互证）\n\n## ⚠️ 常见误读 / 溯源提示\n- '第二曲线'近年在国内被营销化滥用，汉迪原意是'在鼎盛期主动自我颠覆'而非'不行了再找新路'\n\n## 关联\n- [[马奇]]\n- [[科斯]]\n- [[理论-平台战略与网络效应]]\n- [[经验-安迪·格鲁夫-高产出管理]]\n\n---\n📚 溯源：《管理的众神》（Gods of Management, 1978）；《非理性的时代》（The Age of Unreason, 1989）；《大象与跳蚤》（2001）；《空雨衣》（1994） ｜ 权威等级：一手著作\n"}, {"n": "威廉姆森", "cn": false, "t": "近代·1932—2020", "sch": "交易成本经济学", "lv": "L1", "brief": "交易成本分析与企业边界（2009年诺贝尔经济学奖）", "y": 1932, "body": "---\ntags: [存目]\n---\n# 威廉姆森\n\n交易成本经济学：资产专用性与治理结构匹配（市场/混合/科层）。科斯的直接理论继承者。关联：[[科斯]]\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "卡尼曼", "cn": false, "t": "近代·1934—2024", "sch": "行为经济学", "lv": "L1", "brief": "前景理论与双系统加工：有限理性为何系统性偏离（2002年诺奖）", "y": 1934, "body": "---\ntags: [存目]\n---\n# 卡尼曼\n\n行为经济学：前景理论与有限理性的心理学基础。2002年诺奖。关联：[[西蒙]]。\n\n> ⚑ 存目桩页：为保持图谱连通而设，尚未展开人物/主题卡片。"}, {"n": "野中郁次郎", "cn": false, "t": "近代·1935—", "sch": "知识管理", "lv": "L1", "brief": "SECI螺旋与\"场\"：隐性知识如何显性化", "y": 1935, "body": "---\n姓名: 野中郁次郎\n国别: 外国\n时代: 知识管理\n生卒/年代: 1935—\n思想流派: 知识创造·日本管理\n资料权威等级: 一手资料（原典）\n一手资料来源: 与竹内弘高《创造知识的企业》（The Knowledge-Creating Company, 1995）；与胜见惠子《知识创造的螺旋》（2000）；《实践智慧》（2011）\ntags: [管理思想, 外国, 现代, 知识管理]\n---\n# 野中郁次郎\n\n> **一句话定位**：SECI模型（社会化—外化—组合—内化）的作者，把日本企业的隐性知识管理理论化。\n\n## 核心管理思想\n- 知识两分：隐性知识（经验、直觉）vs 显性知识（文档、数据），企业创新=二者转化\n- SECI螺旋：社会化（师徒传承）、外化（隐喻与概念化）、组合（体系化）、内化（干中学）——知识在螺旋中增值\n- 场（Ba）：知识创造所需的共享情境——物理场、虚拟场、心智场\n- 承上启下式管理（Middle-up-down）：知识创造的核心在现场与中层的交汇\n- 过合格化：日本式质量管理绝不达标即止的知识观\n\n## 代表著作 / 一手资料\n- 《创造知识的企业》（1995）；《知识创造的螺旋》（2000）；《实践智慧》（2011）\n\n## 与现代管理的映射\n- SECI → 企业知识库、复盘制度与导师制\n- Ba → 创新空间与协作平台设计\n\n## ⚠️ 常见误读 / 溯源提示\n- SECI被做成流程图后，其场与动态螺旋的有机性被丢失；且该模型源于日本企业（松下、本田）案例，在强个人主义文化中应用需改造（野中本人后来提出实践智慧做文化修正）\n\n## 关联\n- [[马奇]]\n- [[德鲁克]]\n- [[大前研一]]\n\n---\n📚 溯源：与竹内弘高《创造知识的企业》（The Knowledge-Creating Company, 1995）；与胜见惠子《知识创造的螺旋》（2000）；《实践智慧》（2011） ｜ 权威等级：一手资料（原典）\n"}, {"n": "杰克·韦尔奇", "cn": false, "t": "近代·1935—2020", "sch": "实务派", "lv": "L4", "brief": "数一数二+无边界组织", "y": 1935, "body": "---\n姓名: 杰克·韦尔奇\n国别: 外国\n时代: 企业实践\n生卒/年代: 1935—2020\n思想流派: 通用电气·实务派\n资料权威等级: 一手资料（自传/讲话，需与官方叙事区分）\n一手资料来源: 《杰克·韦尔奇自传》（Jack: Straight from the Gut, 2001，与拜恩合著）；《赢》（Winning, 2005）；《商业的本质》（2015）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 杰克·韦尔奇\n\n> **一句话定位**：“世纪经理人”，通用电气1981-2001掌门，数一数二、末位淘汰与无边界组织的推行者。\n\n## 核心管理思想\n- 数一数二原则：各业务必须在市场前三，否则整顿、出售或关闭\n- 活力曲线：末位10%淘汰（271分布）——强制分布的极端样本\n- 无边界组织：打破部门墙，跨层级、跨地域的知识流动\n- 群策群力（Work-Out）：大规模员工参与式改进会议\n- 坦率文化：缺乏坦率是组织的癌症——组织心理安全的前奏\n\n## 代表著作 / 一手资料\n- 《杰克·韦尔奇自传》（2001）；《赢》（2005）\n\n## 与现代管理的映射\n- 活力曲线 → 强制分布与绩效校准会\n- 无边界 → 平台型组织与内部市场化\n\n## ⚠️ 常见误读 / 溯源提示\n- ①GE业绩神话近年被重新审视（其后期利润含大量金融工程与回购贡献），韦尔奇模式不可简单复制；②末位淘汰对创新文化与心理安全的长期伤害在硅谷已有反证，引用需两面俱陈\n\n## 关联\n- [[德鲁克]]\n- [[科层制]]\n- [[理论-组织文化三层次]]\n\n---\n📚 溯源：《杰克·韦尔奇自传》（Jack: Straight from the Gut, 2001，与拜恩合著）；《赢》（Winning, 2005）；《商业的本质》（2015） ｜ 权威等级：一手资料（自传/讲话，需与官方叙事区分）\n"}, {"n": "安迪·格鲁夫", "cn": false, "t": "近代·1936—2011", "sch": "高产出管理", "lv": "L1", "brief": "OKR 与管理杠杆率", "y": 1936, "body": "---\n姓名: 安迪·格鲁夫\n国别: 外国\n时代: 现代\n生卒/年代: 1936—2016\n思想流派: 英特尔·高产出管理\n资料权威等级: 一手著作\n一手资料来源: 《高产出管理》（High Output Management, 1983）；《只有偏执狂才能生存》（1996）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 安迪·格鲁夫\n\n> **一句话定位**：英特尔前CEO，OKR的源流之父（iMBO），把'杠杆率'概念引入管理。\n\n## 核心管理思想\n- 经理产出=其直接管辖与间接影响团队的产出之和——用产出而非忙碌衡量管理\n- 管理杠杆率：会议、决策、培训均可放大或缩小组织产出\n- 在Intel推行iMBO（英特尔目标管理法），后经约翰·杜尔带入谷歌并更名OKR\n- 战略转折点（Strategic Inflection Point）：10倍速变化信号与'Only the paranoid survive'\n\n## 代表著作 / 一手资料\n- 《高产出管理》（1983）；《只有偏执狂才能生存》（1996）\n\n## 与现代管理的映射\n- 杠杆率 → 管理者时间配置\n- 战略转折点 → 颠覆式创新的组织预警（与克里斯坦森互证）\n\n## ⚠️ 常见误读 / 溯源提示\n- OKR常被说成'谷歌发明'，谱系实为德鲁克MBO→格鲁夫iMBO→杜尔带入谷歌（《Measure What Matters》2018明言）\n\n## 关联\n- [[德鲁克]]\n- [[理论-OKR]]\n- [[克里斯坦森]]\n- [[经验-安迪·格鲁夫-高产出管理]]\n\n---\n📚 溯源：《高产出管理》（High Output Management, 1983）；《只有偏执狂才能生存》（1996） ｜ 权威等级：一手著作\n"}, {"n": "豪斯", "cn": false, "t": "近代·1936—2011", "sch": "路径-目标理论", "lv": "L1", "brief": "领导为下属扫清障碍四种领导行为", "y": 1936, "body": "---\n姓名: 豪斯\n国别: 外国\n时代: 权变理论\n生卒/年代: 1936—2011\n思想流派: 路径—目标理论\n资料权威等级: 一手资料（原典）\n一手资料来源: 《领导效能的路径—目标理论》（A Path-Goal Theory of Leader Effectiveness, ASQ 1971）；与Mitchell修订版（1974）\ntags: [管理思想, 外国, 现代, 权变理论]\n---\n# 豪斯\n\n> **一句话定位**：领导者的工作是扫清障碍、铺平道路，让下属相信目标值得且可达。\n\n## 核心管理思想\n- 理论核心：领导者行为影响下属对路径—目标关系的预期，进而影响动机\n- 四种领导行为：指令型、支持型、参与型、成就导向型\n- 两类权变因素：环境因素（任务结构、正式权力系统、工作群体）与下属特征（控制点、经验、能力）\n- 补位原则：任务模糊时给指令，任务压抑时给支持——领导者补环境之缺\n\n## 代表著作 / 一手资料\n- 1971年ASQ论文《路径—目标领导理论》；1974年与Mitchell修订版\n\n## 与现代管理的映射\n- 路径—目标 → 情境化领导与员工辅导\n- 成就导向型 → 高潜人才激励\n\n## ⚠️ 常见误读 / 溯源提示\n- 其理论在2000年代被重提用于解释服务型领导与真实型领导，引用经典版本应回到1971年ASQ原文而非商业解读本\n\n## 关联\n- [[菲德勒]]\n- [[赫塞与布兰查德]]\n- [[服务型领导]]\n\n---\n📚 溯源：《领导效能的路径—目标理论》（A Path-Goal Theory of Leader Effectiveness, ASQ 1971）；与Mitchell修订版（1974） ｜ 权威等级：一手资料（原典）\n"}, {"n": "伊查克·爱迪思", "cn": false, "t": "近代·1937—", "sch": "企业生命周期", "lv": "L1", "brief": "企业生命周期PAEI与处理低增长与衰退的四种战略", "y": 1937, "body": "---\n姓名: 伊查克·爱迪思\n国别: 外国\n时代: 现代（美籍以色列裔）\n生卒/年代: 1937—\n思想流派: 企业生命周期\n资料权威等级: 一手著作\n一手资料来源: 《企业生命周期》（Corporate Lifecycles, 1988）；《把握变革》（Managing Corporate Lifecycles, 1999）\ntags: [管理思想, 外国, 现代, 组织理论]\n---\n# 伊查克·爱迪思\n\n> **一句话定位**：企业生命周期理论（PAEI模型）作者，把企业当作有机体诊断。\n\n## 核心管理思想\n- PAEI四角色：P目标（产出）/A行政（程序）/E创新（创业）/I整合（文化）；健康组织需四者动态平衡\n- 十阶段生命周期：孕育-婴儿-学步-青春-盛年-稳定-贵族-官僚化早期-官僚期-死亡\n- 各阶段典型病：学步期'创业者陷阱'、贵族期'内部政治化'、官僚期'形式主义'\n\n## 代表著作 / 一手资料\n- 《企业生命周期》（1988）；《把握变革》（1999）\n\n## 与现代管理的映射\n- 生命周期诊断 → 组织发展OD与变革时机选择\n- PAEI → 高管团队角色互补配置\n\n## ⚠️ 常见误读 / 溯源提示\n- 生命周期是'诊断框架'而非'宿命论'：盛年企业可通过再创业（E角色回注）重启生命周期\n\n## 关联\n- [[理论-企业生命周期PAEI]]\n- [[理论-Greiner组织成长模型]]\n- [[科特]]\n\n---\n📚 溯源：《企业生命周期》（Corporate Lifecycles, 1988）；《把握变革》（Managing Corporate Lifecycles, 1999） ｜ 权威等级：一手著作\n"}, {"n": "明茨伯格", "cn": false, "t": "近代·1939—", "sch": "经理角色", "lv": "L1", "brief": "十角色+涌现战略+战略十学派：《 Mintzberg 的经理工作》", "y": 1939, "body": "---\n姓名: 明茨伯格\n国别: 外国\n时代: 经理角色学派\n生卒/年代: 1939—\n思想流派: 经理角色学派\n资料权威等级: 一手资料（原典）\n一手资料来源: 《管理工作的性质》（The Nature of Managerial Work, 1973）；《战略历程》（Strategy Safari, 1998，与阿尔斯特兰德、兰佩尔合著）；《管理者而非MBA》（2004）；《管理进行时》（2009）\ntags: [管理思想, 外国, 现代, 经理角色]\n---\n# 明茨伯格\n\n> **一句话定位**：对“战略是规划出来的”最尖锐的批评者，经理角色观察研究的鼻祖。\n\n## 核心管理思想\n- 经理十种角色：挂名首脑、领导者、联络者（人际关系）；监听者、传播者、发言人（信息）；企业家、故障排除者、资源分配者、谈判者（决策）\n- 管理工作五特征：节奏快、碎片化、口头沟通为主、非正式网络驱动、艺术多于科学\n- 手艺人式战略：战略是涌现（emergent）而非规划（deliberate）——战略如陶艺人捏塑\n- 结构配置五型：简单结构、机械科层、专业科层、事业部制、临时委员会制（Adhocracy）\n- 对MBA教育的批判：培养错误的自信\n\n## 代表著作 / 一手资料\n- 《管理工作的性质》（1973）；《战略历程》（1998）；《管理者而非MBA》（2004）\n\n## 与现代管理的映射\n- 涌现战略 → 敏捷战略与复盘迭代\n- 角色理论 → 管理者自我诊断\n- 临时委员会制 → 项目型组织\n\n## ⚠️ 常见误读 / 溯源提示\n- “战略规划无用论”是误读：他批判的是把战略规划当作精确预测的伪科学，承认深思熟虑的战略仍重要——《战略历程》同时呈现十大学派而非独尊一家\n\n## 关联\n- [[安索夫]]\n- [[迈克尔·波特]]\n- [[战略管理]]\n\n---\n📚 溯源：《管理工作的性质》（The Nature of Managerial Work, 1973）；《战略历程》（Strategy Safari, 1998，与阿尔斯特兰德、兰佩尔合著）；《管理者而非MBA》（2004）；《管理进行时》（2009） ｜ 权威等级：一手资料（原典）\n"}, {"n": "罗伯特·卡普兰", "cn": false, "t": "近代·1940—", "sch": "平衡计分卡", "lv": "L1", "brief": "财务/客户/内部流程/学习成长四维度BSC与战略地图", "y": 1940, "body": "---\n姓名: 罗伯特·卡普兰\n国别: 外国\n时代: 现代\n生卒/年代: 1940—\n思想流派: 平衡计分卡\n资料权威等级: 一手著作\n一手资料来源: 与戴维·诺顿：HBR《平衡计分卡》（1992）、《平衡计分卡》（1996）、《战略地图》（2000）、《战略中心型组织》（2001）\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 罗伯特·卡普兰\n\n> **一句话定位**：平衡计分卡与作业成本法（ABC）之父，把战略转译为可衡量指标体系的会计学家。\n\n## 核心管理思想\n- 平衡计分卡四维度：财务-客户-内部流程-学习成长；平衡短期结果与长期驱动\n- 战略地图：把无形资产（人力/信息/文化）转化为因果链上的财务成果\n- 平衡计分卡的'平衡'三义：外部与内部、结果与驱动、主观与客观\n- 作业成本法（ABC）：成本应追溯到作业与产品，而非按工时粗放分摊\n\n## 代表著作 / 一手资料\n- HBR 1992《平衡计分卡》；《战略地图》（2000）；《战略中心型组织》（2001）\n\n## 与现代管理的映射\n- BSC → 从KPI清单升级为战略因果系统\n- ABC → 定价与产品组合决策\n\n## ⚠️ 常见误读 / 溯源提示\n- 最大失效方式：把BSC当'四个维度的KPI大杂烩'，丢弃因果链与战略对话功能——卡普兰本人反复强调BSC是沟通战略的语言而非考核表\n\n## 关联\n- [[理论-平衡计分卡BSC]]\n- [[理论-战略地图]]\n- [[德鲁克]]\n- [[默顿（目标置换）]]\n\n---\n📚 溯源：与戴维·诺顿：HBR《平衡计分卡》（1992）、《平衡计分卡》（1996）、《战略地图》（2000）、《战略中心型组织》（2001） ｜ 权威等级：一手著作\n"}, {"n": "威廉·大内", "cn": false, "t": "近代·1943—", "sch": "Z理论", "lv": "L1", "brief": "美日管理的A型/J型比较：《Z理论》1981", "y": 1943, "body": "---\n姓名: 威廉·大内\n国别: 外国\n时代: 比较管理\n生卒/年代: 1943—\n思想流派: Z理论·美日比较\n资料权威等级: 一手资料（原典）\n一手资料来源: 《Z理论：美国企业如何应对日本挑战》（Theory Z, 1981）；《M型社会：美国企业如何接受日本挑战》（1984）\ntags: [管理思想, 外国, 现代, 行为科学]\n---\n# 威廉·大内\n\n> **一句话定位**：把日本管理的隐性契约翻译成美式组织语言，Z理论的作者。\n\n## 核心管理思想\n- Z理论：把日本式终身雇佣、缓慢晋升、集体决策、关怀整合进美国企业的混合型模式\n- A型（美国）vs J型（日本）组织比较：短期雇佣vs长期、个人决策vs共识决策、专业晋升vs轮岗\n- 微妙性与亲密性：集体决策的信息质量优势\n- Z型变革步骤：授权与自我指挥的渐进改造\n\n## 代表著作 / 一手资料\n- 《Z理论》（1981）；《M型社会》（1984）\n\n## 与现代管理的映射\n- Z理论 → 长期雇佣与企业文化建设的美国实践\n- 微妙性 → 参与式决策的信息优势\n\n## ⚠️ 常见误读 / 溯源提示\n- Z理论常被当成学日本的简单口号：大内本意是A型与J型的整合设计，且他承认日本模式在1980年代末已现裂缝（《M型社会》即反思）\n\n## 关联\n- [[麦格雷戈]]\n- [[丰田生产方式]]\n- [[野中郁次郎]]\n\n---\n📚 溯源：《Z理论：美国企业如何应对日本挑战》（Theory Z, 1981）；《M型社会：美国企业如何接受日本挑战》（1984） ｜ 权威等级：一手资料（原典）\n"}, {"n": "大前研一", "cn": false, "t": "近代·1943—", "sch": "战略咨询", "lv": "L2", "brief": "3C战略与全球价值链对标", "y": 1943, "body": "---\n姓名: 大前研一\n国别: 外国\n时代: 战略咨询\n生卒/年代: 1943—\n思想流派: 战略·无国界管理\n资料权威等级: 一手资料（原典，注意其著作多经本人审定英译）\n一手资料来源: 《战略家的头脑》（The Mind of the Strategist, 1982）；《无国界的世界》（The Borderless World, 1990）；《专业主义》（2005）\ntags: [管理思想, 外国, 现代, 定位学派]\n---\n# 大前研一\n\n> **一句话定位**：麦肯锡日本分社创始人，“战略是意志的表达”——用围棋式整体思维补波特的结构分析。\n\n## 核心管理思想\n- 战略家的头脑：日本式战略强调洞察、创造力与全员共享，而非美式计划与分解\n- 3C分析：顾客（Customer）、竞争对手（Competitor）、公司（Company）——战略三角\n- 战略即差异化：成功的战略家从不做跟别人一样的事\n- 无国界经营：全球整合生产网络（全球棋盘），模块化的比较优势利用\n- 专业主义：专家要控制自己的情感，以理性与纪律取胜\n\n## 代表著作 / 一手资料\n- 《战略家的头脑》（1982）；《无国界的世界》（1990）；《专业主义》（2005）\n\n## 与现代管理的映射\n- 3C → 战略分析三角工具\n- 全球棋盘 → 全球供应链布局\n\n## ⚠️ 常见误读 / 溯源提示\n- 其著作多先有日文后有英文版，《战略家的头脑》英文版由他人编写西方案例章节，引用英文版时需注意与原版差异\n\n## 关联\n- [[迈克尔·波特]]\n- [[野中郁次郎]]\n- [[孙武（孙子）]]\n\n---\n📚 溯源：《战略家的头脑》（The Mind of the Strategist, 1982）；《无国界的世界》（The Borderless World, 1990）；《专业主义》（2005） ｜ 权威等级：一手资料（原典，注意其著作多经本人审定英译）\n"}, {"n": "金伟灿", "cn": false, "t": "近代·1945—", "sch": "蓝海战略", "lv": "L1", "brief": "价值创新与重构市场边界（蓝海战略为二人合著）", "y": 1945, "body": "---\n姓名: 金伟灿\n国别: 外国\n时代: 现代（韩裔）\n生卒/年代: —\n思想流派: 蓝海战略\n资料权威等级: 一手著作（框架书）\n一手资料来源: 与莫博涅合著《蓝海战略》（Blue Ocean Strategy, 2005/扩展版2015）\ntags: [管理思想, 外国, 现代, 定位学派]\n---\n# 金伟灿\n\n> **一句话定位**：INSEAD教授，蓝海战略与价值创新框架作者。\n\n## 核心管理思想\n- 价值创新：同时追求差异化与低成本，打破价值-成本权衡\n- ERRC四动作框架：剔除（Eliminate）-减少（Reduce）-增加（Raise）-创造（Create）\n- 战略画布与价值曲线：把竞争要素可视化，寻求'非顾客'新需求\n\n## 代表著作 / 一手资料\n- 《蓝海战略》（2005，扩展版2015）；《蓝海转型》（2017）\n\n## 与现代管理的映射\n- ERRC → 产品定义与创新工作坊标准工具\n- 战略画布 → 竞争要素对标可视化\n\n## ⚠️ 常见误读 / 溯源提示\n- 蓝海≠逃避竞争：框架强调重建市场边界；且蓝海会被模仿变红，需动态更新价值曲线\n\n## 关联\n- [[迈克尔·波特]]\n- [[理论-蓝海战略]]\n- [[大前研一]]\n\n---\n📚 溯源：与莫博涅合著《蓝海战略》（Blue Ocean Strategy, 2005/扩展版2015） ｜ 权威等级：一手著作（框架书）\n"}, {"n": "艾利·高德拉特", "cn": false, "t": "近代·1947—", "sch": "约束理论", "lv": "L1", "brief": "识别并利用系统约束以持续产出：《关键链》1999", "y": 1947, "body": "---\n姓名: 艾利·高德拉特\n国别: 外国\n时代: 现代（以色列）\n生卒/年代: 1947—2011\n思想流派: 约束理论TOC\n资料权威等级: 一手著作（小说体）\n一手资料来源: 《目标》（The Goal, 1984，小说体管理著作）；《关键链》（1997）；《绝不是靠运气》（1994）\ntags: [管理思想, 外国, 现代, 管理科学]\n---\n# 艾利·高德拉特\n\n> **一句话定位**：物理学家出身的管理学家，以小说《目标》传播'约束理论'，史上最畅销管理小说作者。\n\n## 核心管理思想\n- 系统产出由瓶颈（约束）决定：五步骤聚焦（Identify-Exploit-Subordinate-Elevate-Repeat）\n- 有效产出会计：以'有效产出-库存-运营费用'替代传统成本会计的三个度量\n- 关键链项目管理：安全时间集中管理，对抗帕金森定律与学生综合征\n- 思维过程（TP）：因果逻辑树诊断系统问题\n\n## 代表著作 / 一手资料\n- 《目标》（1984）；《绝不是靠运气》（1994）；《关键链》（1997）；《仍然不足够》（2000）\n\n## 与现代管理的映射\n- TOC五步骤 → 瓶颈改善与资源调度\n- 有效产出会计 → 管理会计改造\n\n## ⚠️ 常见误读 / 溯源提示\n- 小说体裁常被误认为'通俗读物而理论不严谨'：TOC有严密的逻辑与大量实证；与精益互补（聚焦瓶颈 vs 全面消浪费）而非对立\n\n## 关联\n- [[理论-约束理论TOC]]\n- [[大野耐一]]\n- [[伯法]]\n\n---\n📚 溯源：《目标》（The Goal, 1984，小说体管理著作）；《关键链》（1997）；《绝不是靠运气》（1994） ｜ 权威等级：一手著作（小说体）\n"}, {"n": "芭芭拉·明托", "cn": false, "t": "近代·1947—", "sch": "表达与思维", "lv": "L1", "brief": "《金字塔原理》1973：以结论先行、以上统下的表达法则", "y": 1947, "body": "---\n姓名: 芭芭拉·明托\n国别: 外国\n时代: 现代\n生卒/年代: —\n思想流派: 结构化表达\n资料权威等级: 一手著作\n一手资料来源: 《金字塔原理》（The Minto Pyramid Principle, 1985初版/1996修订）——麦肯锡内部教材出身\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 芭芭拉·明托\n\n> **一句话定位**：麦肯锡第一位女性咨询顾问，结构化表达（金字塔原理）的作者。\n\n## 核心管理思想\n- 结论先行、以上统下、归类分组、逻辑递进：读者记忆与理解的认知规律\n- SCQA序言结构：情境-冲突-疑问-回答，引出中心论点\n- MECE：相互独立、完全穷尽的分类纪律\n- 思想以'行动性句子'呈现：每组思想是对下一层的提炼，而非罗列\n\n## 代表著作 / 一手资料\n- 《金字塔原理》（1985/1996）\n\n## 与现代管理的映射\n- 金字塔原理 → 汇报、咨询报告、邮件的标准表达法\n- MECE → 议题树与结构化思维\n\n## ⚠️ 常见误读 / 溯源提示\n- 金字塔原理是'表达与归纳'工具而非'分析'工具：先想清楚（MECE分解）才能写得清楚；市面课程常把两者混讲\n\n## 关联\n- [[理论-金字塔原理]]\n- [[理论-MECE法则]]\n- [[经验-咨询七步成诗]]\n\n---\n📚 溯源：《金字塔原理》（The Minto Pyramid Principle, 1985初版/1996修订）——麦肯锡内部教材出身 ｜ 权威等级：一手著作\n"}, {"n": "迈克尔·波特", "cn": false, "t": "近代·1947—", "sch": "定位学派", "lv": "L1", "brief": "五力+通用战略+取舍配称", "y": 1947, "body": "---\n姓名: 迈克尔·波特\n国别: 外国\n时代: 战略管理\n生卒/年代: 1947—\n思想流派: 定位学派\n资料权威等级: 一手资料（原典+权威二手）\n一手资料来源: 《竞争战略》（Competitive Strategy, 1980）；《竞争优势》（1985）；《国家竞争优势》（1990）；HBR《什么是战略》（What Is Strategy, 1996）\ntags: [管理思想, 外国, 现代, 定位学派]\n---\n# 迈克尔·波特\n\n> **一句话定位**：产业组织经济学导入战略管理的旗手，五力与三大通用战略的作者。\n\n## 核心管理思想\n- 五力模型：现有竞争、新进入者、替代品、供应商议价、购买者议价——产业结构决定盈利空间\n- 三大通用战略：成本领先、差异化、聚焦——夹在中间者利润最低\n- 价值链：企业拆为基本活动与支持活动，利润产生于环节间协同（1985）\n- 什么是战略（1996）：战略=取舍（trade-offs）+配称（fit）+独特活动系统——运营效益≠战略\n- 钻石模型：国家竞争优势四要素（生产要素、需求条件、相关与支持产业、企业战略结构与同业竞争）\n\n## 代表著作 / 一手资料\n- 《竞争战略》（1980）；《竞争优势》（1985）；《国家竞争优势》（1990）；HBR 1996《什么是战略》\n\n## 与现代管理的映射\n- 五力 → 行业分析与进入决策\n- 价值链 → 流程再造与外包决策\n- 取舍与配称 → 战略聚焦\n\n## ⚠️ 常见误读 / 溯源提示\n- ①五力模型常被当作完整战略理论，波特本人强调它只是分析工具，战略核心是取舍与配称；②“夹在中间必死”被绝对化，后续研究（混合战略、最佳价值战略）已松动该结论\n\n## 关联\n- [[理论-波特五力模型]]\n- [[安索夫]]\n- [[明茨伯格]]\n- [[孙武（孙子）]]\n\n---\n📚 溯源：《竞争战略》（Competitive Strategy, 1980）；《竞争优势》（1985）；《国家竞争优势》（1990）；HBR《什么是战略》（What Is Strategy, 1996） ｜ 权威等级：一手资料（原典+权威二手）\n"}, {"n": "圣吉", "cn": false, "t": "近代·1947—", "sch": "系统学派", "lv": "L1", "brief": "第五项修炼+系统基模：《第五项修炼》1990", "y": 1947, "body": "---\n姓名: 圣吉\n国别: 外国\n时代: 学习型组织\n生卒/年代: 1947—\n思想流派: 系统动力学·学习型组织\n资料权威等级: 一手资料（原典）\n一手资料来源: 《第五项修炼：学习型组织的艺术与实务》（The Fifth Discipline, 1990）；《第五项修炼·实践篇》（1994）；《必要的革命》（2008）\ntags: [管理思想, 外国, 现代, 系统学派]\n---\n# 圣吉\n\n> **一句话定位**：“学习型组织”之父，把系统动力学变成全球管理者的修炼语言。\n\n## 核心管理思想\n- 第五项修炼：系统思考——其余四项（自我超越、心智模式、共同愿景、团队学习）因它而整合\n- 系统基模：成长上限、舍本逐末、饮鸩止渴等——组织反复犯错的结构原因\n- 学习智障：我就是我的职位、归罪于外、煮蛙效应、从经验学习的错觉——组织学习的七大障碍\n- 啤酒游戏：揭示供应链逐级放大（牛鞭效应）的经典教学实验\n\n## 代表著作 / 一手资料\n- 《第五项修炼》（1990）；《第五项修炼·实践篇》（1994）；《必要的革命》（2008）\n\n## 与现代管理的映射\n- 系统思考 → 复杂系统管理与跨部门协同\n- 啤酒游戏 → 供应链管理与牛鞭效应教学\n\n## ⚠️ 常见误读 / 溯源提示\n- 学习型组织被异化为培训组织：圣吉的核心是心智模式与系统结构变革，培训只是子手段；其理论源自系统动力学（Forrester），引用时应注明学理谱系\n\n## 关联\n- [[流派-系统学派]]\n- [[马奇]]\n- [[组织学习]]\n\n---\n📚 溯源：《第五项修炼：学习型组织的艺术与实务》（The Fifth Discipline, 1990）；《第五项修炼·实践篇》（1994）；《必要的革命》（2008） ｜ 权威等级：一手资料（原典）\n"}, {"n": "科特", "cn": false, "t": "近代·1947—", "sch": "变革领导", "lv": "L1", "brief": "变革八步法：《领导变革》1995", "y": 1947, "body": "---\n姓名: 科特\n国别: 外国\n时代: 变革管理\n生卒/年代: 1947—\n思想流派: 变革领导\n资料权威等级: 一手资料（原典）\n一手资料来源: 《领导变革》（Leading Change, 1996）；HBR《领导者真正做什么》（What Leaders Really Do, 1990）；《变革之心》（2002）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 科特\n\n> **一句话定位**：哈佛变革管理双权威之一，八步变革法的作者。\n\n## 核心管理思想\n- 领导≠管理：管理处理复杂性问题（计划、预算、组织），领导处理变革问题（定方向、联盟、激励）\n- 变革八步：营造紧迫感→建立指导联盟→确立愿景→传播愿景→授权行动→创造短期胜利→巩固成果→融入文化\n- 变革不能一步步规划：成功的变革70-90%靠领导，10-30%靠管理\n- 文化变革的最后一步最难：变革成果必须沉淀为新文化\n\n## 代表著作 / 一手资料\n- 《领导变革》（1996）；HBR 1990《领导者真正做什么》；《变革之心》（2002）\n\n## 与现代管理的映射\n- 八步法 → 组织变革项目剧本\n- 领导/管理二分 → 变革期高管角色分工\n\n## ⚠️ 常见误读 / 溯源提示\n- 八步法被当成线性清单是常见误用：科特强调紧迫感与联盟的建立是循环反复的过程；且步骤模型源于企业案例归纳，普适性弱于实验证据\n\n## 关联\n- [[库尔特·勒温]]\n- [[组织变革]]\n- [[德鲁克]]\n\n---\n📚 溯源：《领导变革》（Leading Change, 1996）；HBR《领导者真正做什么》（What Leaders Really Do, 1990）；《变革之心》（2002） ｜ 权威等级：一手资料（原典）\n"}, {"n": "哈默", "cn": false, "t": "近代·1948—", "sch": "流程再造", "lv": "L1", "brief": "别自动化，要彻底重来", "y": 1948, "body": "---\n姓名: 哈默\n国别: 外国\n时代: 流程再造\n生卒/年代: 1948—\n思想流派: 再造·流程管理\n资料权威等级: 一手资料（原典）\n一手资料来源: HBR《再造工作：别自动化，要彻底重来》（Reengineering Work: Don't Automate, Obliterate, 1990）；与钱皮《再造企业》（Reengineering the Corporation, 1993）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 哈默\n\n> **一句话定位**：“再造”一词的发明者，别用信息技术加速烂流程的呐喊者。\n\n## 核心管理思想\n- 再造定义：从根本上重新思考、彻底重新设计业务流程，以求在成本、质量、速度上戏剧性改善\n- 流程中心 vs 职能中心：以跨部门流程而非部门分工为组织基本单元\n- 别自动化，要彻底重来：IT是使能器，流程重构才是目的\n- 再造的教训：70%的再造项目失败率高企——因其触动权力结构与员工安全感\n\n## 代表著作 / 一手资料\n- HBR 1990《再造工作》；《再造企业》（1993，与钱皮合著）；《再造革命》（1995）\n\n## 与现代管理的映射\n- 流程再造 → 共享服务中心与端到端流程\n- 职能→流程 → 流程型组织与RPA\n\n## ⚠️ 常见误读 / 溯源提示\n- “再造”1990年代被滥用于裁员的代名词，背离其解放流程价值初衷；哈默后期《敏捷流程》（2001）转向流程型组织与快速应变，是其自我修正\n\n## 关联\n- [[钱德勒]]\n- [[德鲁克]]\n- [[丰田生产方式]]\n\n---\n📚 溯源：HBR《再造工作：别自动化，要彻底重来》（Reengineering Work: Don't Automate, Obliterate, 1990）；与钱皮《再造企业》（Reengineering the Corporation, 1993） ｜ 权威等级：一手资料（原典）\n"}, {"n": "达利欧", "cn": false, "t": "近代·1949—", "sch": "原则化组织", "lv": "L2", "brief": "《原则》以极度求真与信任建立原则化的组织算法", "y": 1949, "body": "---\ntags: [存目]\n---\n# 达利欧\n\n桥水创始人，《原则》作者。\n\n> ⚑ 存目桩页：为保持图谱连通而设，待展开。"}, {"n": "克莱顿·克里斯坦森", "cn": false, "t": "近代·1952—2020", "sch": "破坏式创新", "lv": "L1", "brief": "破坏性创新理论：《创新者的窘境》1997", "y": 1952, "body": "---\n姓名: 克莱顿·克里斯坦森\n国别: 外国\n时代: 现代\n生卒/年代: 1952—2020\n思想流派: 创新理论\n资料权威等级: 一手著作\n一手资料来源: 《创新者的窘境》（The Innovator's Dilemma, 1997）；《创新者的解答》（2003）；《与运气竞争》（2016，JTBD）\ntags: [管理思想, 外国, 现代, 创新]\n---\n# 克莱顿·克里斯坦森\n\n> **一句话定位**：颠覆式创新理论之父，'待办任务'（JTBD）视角开创者，哈佛商学院教授。\n\n## 核心管理思想\n- 颠覆式创新：低端/新市场切入的技术进步最终颠覆在位巨头；资源、流程、价值观（RPV）决定组织能做什么创新\n- 五种创新策略：RPV框架解释为什么好公司会失败\n- JTBD（Jobs To Be Done）：顾客'雇用'产品来完成任务——竞争来自所有能完成该任务的方案（含非同类产品）\n- '你要如何衡量你的人生'：把管理理论用于人生战略\n\n## 代表著作 / 一手资料\n- 《创新者的窘境》（1997）；《创新者的解答》（2003）；《与运气竞争》（2016）\n\n## 与现代管理的映射\n- RPV → 组织能力与变革可行性诊断\n- JTBD → 用户研究与产品创新框架\n\n## ⚠️ 常见误读 / 溯源提示\n- '颠覆'一词被滥用为'任何行业新变化'：克里斯坦森严格定义为低端/新市场颠覆，高端豪华电动车等案例不符合定义，他本人晚年亦修正了若干预测\n\n## 关联\n- [[马奇]]\n- [[迈克尔·波特]]\n- [[安迪·格鲁夫]]\n- [[理论-颠覆式创新]]\n\n---\n📚 溯源：《创新者的窘境》（The Innovator's Dilemma, 1997）；《创新者的解答》（2003）；《与运气竞争》（2016，JTBD） ｜ 权威等级：一手著作\n"}, {"n": "柯林斯", "cn": false, "t": "近代·1958—", "sch": "经验研究", "lv": "L3", "brief": "第五级领导+飞轮效应（幸存者偏差、样本选择受批评）", "y": 1958, "body": "---\n姓名: 柯林斯\n国别: 外国\n时代: 企业研究\n生卒/年代: 1958—\n思想流派: 经验研究·基业长青\n资料权威等级: 一手资料（研究著作，非本人管理实践）\n一手资料来源: 《基业长青》（Built to Last, 1994，与波勒斯）；《从优秀到卓越》（Good to Great, 2001）；《再造卓越》（How the Mighty Fall, 2009）\ntags: [管理思想, 外国, 现代, 经验主义]\n---\n# 柯林斯\n\n> **一句话定位**：用档案对比研究回答“什么样的公司能穿越周期”，第五级领导者的命名者。\n\n## 核心管理思想\n- 第五级领导力：谦逊+意志的个人品质组合（个人谦逊与职业意志的矛盾统一）\n- 飞轮效应：卓越不是一次突破，而是持续小推动的累积转动\n- 刺猬理念：三圆交集——你擅长的、能创造利润的、你热爱的\n- 造钟而非报时：伟大公司靠制度与文化自我更新，不靠魅力领袖\n- 直面残酷现实（斯托克代尔悖论）：绝对相信能胜出，同时直面最残酷现实\n\n## 代表著作 / 一手资料\n- 《基业长青》（1994）；《从优秀到卓越》（2001）；《再造卓越》（2009）\n\n## 与现代管理的映射\n- 飞轮 → 战略定力的组织叙事\n- 斯托克代尔悖论 → 韧性领导力\n\n## ⚠️ 常见误读 / 溯源提示\n- ①其样本选择存在幸存者偏差（只研究赢家的配对方法受学界批评）；②第五级领导是事后归纳而非可操作的选拔标准，引用时应注明方法论争议\n\n## 关联\n- [[德鲁克]]\n- [[科特]]\n- [[流派-经验主义]]\n\n---\n📚 溯源：《基业长青》（Built to Last, 1994，与波勒斯）；《从优秀到卓越》（Good to Great, 2001）；《再造卓越》（How the Mighty Fall, 2009） ｜ 权威等级：一手资料（研究著作，非本人管理实践）\n"}]</script>

const bands=[[-780,-221,'先秦 / 古典世界','#f7ecd9'],[-220,1840,'帝制时代 / 工业革命','#f2ead6'],[1841,1949,'近代 / 古典管理','#eee2c8'],[1950,2040,'现代 / 当代管理','#e9dcc0']];
bands.forEach(b=>{
  const el=document.createElement('div');el.className='band';el.style.left=x(b[0])+'px';el.style.width=(x(b[1])-x(b[0]))+'px';el.style.background=b[3];el.style.opacity=.5;cv.appendChild(el);
  const n=document.createElement('div');n.className='band-name';n.style.left=(x(b[0])+x(b[1]))/2+'px';n.textContent=b[2];cv.appendChild(n);
});
[['al-cn',236,'lane-cn lane-label','中国轴 · 政道与治生'],['al-fg',536,'lane-fg lane-label','外国轴 · 从分工到精益']].forEach(a=>{
  const ln=document.createElement('div');ln.className='axis-line '+a[0];cv.appendChild(ln);
  const lb=document.createElement('div');lb.className=a[2];lb.style.top=(a[1]-70)+'px';lb.textContent=a[3];cv.appendChild(lb);
});
function lane(items,laneTop,gap){
  items.sort((a,b)=>a.y-b.y);
  const rowEnd=[];
  items.forEach(it=>{
    const xi=x(it.y), w=it.n.length*15+90;
    let r=0;
    while(r<rowEnd.length&&rowEnd[r]>xi-10)r++;
    rowEnd[r]=xi+w;
    const el=document.createElement('div');
    el.className='node '+(it.cn?'cn':'fg');
    el.style.left=xi+'px';el.style.top=(laneTop+r*gap)+'px';el.style.transform='translateX(-50%)';
    el.innerHTML='<div class="dot"></div><div class="nm"><b>'+it.n+'</b><span class="lv lv-'+it.lv+'">'+it.lv+'</span></div>';
    el.onmousemove=e=>{
      const tip=document.getElementById('tip');
      tip.style.display='block';
      tip.innerHTML='<b>'+it.n+'</b>（'+it.sch+'·'+it.lv+'）｜'+it.t+'<br>'+it.brief+(it.body?'<br><span style="color:#c8a24a">点击查看完整卡片 →</span>':'');
      tip.style.left=Math.min(e.clientX+16,innerWidth-340)+'px';
      tip.style.top=(e.clientY+14)+'px';
    };
    el.onmouseleave=()=>{document.getElementById('tip').style.display='none';};
    el.onclick=()=>{
      if(!it.body)return;
      document.getElementById('mbody').innerHTML='<h2 style="font-family:KaiTi;font-size:20px">'+it.n+'</h2><div class="fm">'+it.t+'｜'+it.sch+'｜资料等级 '+it.lv+'</div><div class="body">'+it.body.replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,'$2$1')+'</div>';
      document.getElementById('modal').classList.add('show');
      document.getElementById('tip').style.display='none';
    };
    cv.appendChild(el);
  });
}
lane(DATA.filter(d=>d.cn),152,44);
lane(DATA.filter(d=>!d.cn),452,44);

function zoom(f,reset){Z=reset?1:Math.min(2.5,Math.max(0.4,Z*f));document.body.style.zoom=Z;}
document.getElementById('stage').scrollLeft=W*0.42;
